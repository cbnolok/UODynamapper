# Graphics settings for UODynamapper
# These values are tunable from the UI.

[graphics]
# Use BC7 texture compression to save VRAM
lossy_texture_compression = false
# BC7 encoder backend: "image_dds", "block_compression", or "ispc"
lossy_texture_compression_backend = "image_dds"
# Lower frame rate when the window is not focused
reduce_unfocused_fps = true
vsync = false
# Anti-aliasing: "off", "fxaa", "smaa", "msaa_2x", "msaa_4x"
anti_aliasing = "off"

# Texture filtering: 0 = Point, 1 = Linear
texture_filtering = 0
# Reconstruction mode: 0 = None, 1 = Bicubic, 2 = FSR
texture_reconstruction = 0
# Per-frame sharpening applied by shader (0.0 to 1.0)
sharpening_strength = 0.0
