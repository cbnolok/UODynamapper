# Developer-facing worldmap rendering controls.
#
# Keep these values in a text file instead of the in-app preferences UI:
# they are intended for renderer tuning and regression diagnosis, not
# for normal end-user tweaking.

[land_streaming]
# Main-world terrain preparation budget measured in equivalent 8x8 map blocks.
# Set to 0 to remove this cap entirely.
prepare_max_blocks_per_frame = 32768

# Maximum number of metadata-atlas write_texture uploads submitted in one frame.
# Set to 0 to remove this cap entirely.
upload_max_ops_per_frame = 8

# Maximum metadata-atlas bytes uploaded in one frame.
# Set to 0 to remove this cap entirely.
upload_max_bytes_per_frame = 16777216
