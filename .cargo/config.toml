# Stable Cargo configuration.
#
# Nightly-only profile rustflags live in config.nightly.toml and can be enabled
# with: cargo +nightly --config .cargo/config.nightly.toml ...

[build]
#target-dir = "target"
target-dir = "/home/claudio/_builds/"

# ----------
# Linux, GNU libc (default)
# ----------

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.'cfg(target_os = "linux")']
rustflags = [
  # rustc flags
  "-C", "embed-bitcode=no",
  # linker flags
  "-Clink-arg=-Wl,--gc-sections",
  "-Clink-arg=-Wl,--no-allow-shlib-undefined",
]

# ----------
# Linux, Musl libc (statically linked)
# ----------

[target.x86_64-unknown-linux-musl]
rustflags = [
  # rustc flags
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "embed-bitcode=no",
  # linker flags
  "-Clink-arg=-Wl,--gc-sections",
  "-Clink-arg=-Wl,--no-allow-shlib-undefined",
]
#linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
rustflags = [
  # rustc flags
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "embed-bitcode=no",
  # linker flags
  "-Clink-arg=-Wl,--gc-sections",
  "-Clink-arg=-Wl,--no-allow-shlib-undefined",
]
#linker = "aarch64-linux-musl-gcc"

# ----------
# macOS
# ----------

[target.'cfg(target_os = "macos")']
rustflags = [
  # rustc flags
  "-C", "embed-bitcode=no",
  # linker flags
  "-Clink-arg=-Wl,-dead_strip",
]

# ----------
# Windows
# ----------

# On Windows MSVC, statically link the C runtime so that the resulting EXE does
# not depend on the vcruntime DLL.
[target.x86_64-pc-windows-msvc]
#linker = "rust-lld.exe"
rustflags = [
  # rustc flags
  "-C", "target-feature=+crt-static",
]

[target.i686-pc-windows-msvc]
#linker = "rust-lld.exe"
rustflags = [
  # rustc flags
  "-C", "target-feature=+crt-static",
]
