[build]
target-dir = "/home/claudio/_builds/"

# ── Linux ────────────────────────────────────────────────────────────────────
# Use mold for faster linking. mold is stricter than GNU ld: it does not
# implicitly pull in transitive shared-library deps, which is why intel_tex_2's
# ISPC objects need libstdc++ linked explicitly (see build.rs).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=mold"]
# Nightly only RUSTFLAGS: "-Zshare-generics=y", "-Zlocation-detail=none"
#   "-Zbuild-std=std,panic_abort", "-Zbuild-std-features=\"optimize_for_size\""

# ── Windows MSVC ─────────────────────────────────────────────────────────────
# Use lld-link (LLVM's linker) as a faster drop-in for MSVC's link.exe.
# Requires LLVM to be installed and lld-link.exe to be on PATH.
# The MSVC C++ runtime (vcruntime / msvcrt) is linked automatically by the
# MSVC toolchain, so no explicit libstdc++ directive is needed (see build.rs).
[target.x86_64-pc-windows-msvc]
#linker = "lld-link.exe"
# Nightly only: rustflags = ["-Zlinker-features=+lld"]

# ── Windows GNU (MinGW) ───────────────────────────────────────────────────────
# MinGW uses libstdc++ just like Linux, so the build.rs stdc++ directive applies.
# mold supports MinGW targets when invoked via the GNU driver; alternatively
# use lld (-fuse-ld=lld) which has broader Windows GNU support.
[target.x86_64-pc-windows-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld"]
