[package]
name = "uddconv"
version = "0.1.0"
edition = "2021"

[lints.clippy]
needless_lifetimes = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"

[dependencies]
block_compression = { version = "0.7", optional = true, default-features = false, features = ["bc7"] }
byteorder = "1.5.0"
color-eyre = "0.6.5"
guillotiere = "0.6"
image_dds = { version = "0.7" } # Pure Rust code, maximum portability.
intel_tex_2 = { version = "0.5.0", optional = true }
uocf = { path = "../uocf" }
wgpu-types = "27"

[features]
default = []
# Secondary BC7 compression backends, more efficient but less portable than image_dds.
block_compression = ["dep:block_compression"]
block_compression_gpu = ["block_compression", "block_compression/wgpu"]
ispc = ["dep:intel_tex_2"]
ispc_source = ["ispc", "intel_tex_2/ispc"]
# Compatibility aliases for older feature names.
gpu = ["block_compression_gpu"]
intel_tex = ["ispc"]
intel_tex_source = ["ispc_source"]
