# Cargo.toml
[package]
name = "uocf"
version = "0.0.1"
edition = "2021" #"2024"

[lints.clippy]
needless_lifetimes = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
#missing_safety_doc = "allow"

[dependencies]
byteorder = { version = "1.5", features = ["std"] }
color-eyre = { version = "0.6", features = ["track-caller"] }
dds = { version = "0.2", default-features = false }
derive-new = { version = "0.7", default-features = false }
getset = { version = "0.1", default-features = false }
glam = { version = "0.30", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "tga"] }
ddsfile = "0.5.2"
wide = { version = "1", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
bitflags = "2"
nohash-hasher = "0.2.0"
indexmap = "2.14.0"
# Standard Rust log facade — allows uocf to emit log events without
# coupling to any specific logger implementation (the app provides the backend).
log = { version = "0.4", default-features = false }
adler32 = "1.2.0"
flate2 = { version = "1.1.9", features = ["zlib-ng"], default-features = false }
rayon = "1.12.0"
zstd = "0.13"
jpegxl-rs = { version = "0.14", features = ["vendored"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
memmap2 = "0.9"

[features]
profiling = []
tile_mappings_builder = []

[dev-dependencies]
rand = "0.8.6"
