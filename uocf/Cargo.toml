# Cargo.toml
[package]
name = "uocf"
version = "0.0.1"
edition = "2021" #"2024"

[lints.clippy]
needless_lifetimes = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"

[dependencies]
byteorder = { version = "1.5", features = ["std"] }
color-eyre = { version = "0.6", features = ["track-caller"] }
derive-new = { version = "0.7", default-features = false }
getset = { version = "0.1", default-features = false }
glam = { version = "0.30", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "dds"] }
wide = { version = "1", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
# Standard Rust log facade — allows uocf to emit log events without
# coupling to any specific logger implementation (the app provides the backend).
log = { version = "0.4", default-features = false }
#smallvec = "1"
#hashbrown = "0.14"
#nohash-hasher = "0.2"
