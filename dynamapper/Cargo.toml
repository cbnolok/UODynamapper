# Cargo.toml
[package]
name = "dynamapper"
version = "0.0.1"
edition = "2021" # "2024"

[lints.clippy]
needless_lifetimes = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"

[dependencies]
uocf = { path = "../uocf" }
bevy_framepace = { version = "0.21", default-features = false }
bevy_egui = { version = "0.39" }
wgpu = { version = "27.0" } #, default-features = false, features = ["vulkan", "metal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "ansi", "chrono", "fmt", "thread_local", "tracing-log" ] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
color-eyre = { version = "0.6", features = ["track-caller"] }
config = { version = "0.15", default-features = false }
#pad = "0.1"
paris = { version = "1.5", default-features = false, features = ["macros", "no_logger"] } # log formatting
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
strum = { version = "0.28", default-features = false }
strum_macros = { version = "0.28", default-features = false }
#guillotiere = "0.6"
#lru = "0.16"
image = {version = "0.25", default-features = false, features = ["bmp", "png", "dds"]}
time = { version = "0.3", default-features = false }
toml = { version = "1.0", default-features = false, features = ["display", "parse", "serde"] }
#serde, miniserde, nanoserde
serde = { version = "1", default-features = false, features = ["derive"] }
serde_derive = { version = "1.0.228", default-features = false }
#getset = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
#futures-lite = "2"
dashmap = { version = "6", default-features = false }
#parking_lot = "0.12"
#smallvec = "1"
# BC7 texture compression for GPU VRAM reduction (GPU compute).
block_compression = { version = "0.7", default-features = false, features = ["bc7", "wgpu"] }
# System metrics (CPU/RAM). Bevy includes this transitively via sysinfo_plugin,
# but we use it directly here because Bevy's SystemInformationDiagnosticsPlugin
# fails to initialize with dynamic_linking enabled (prints a 'not supported' warning).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tracing = "0.1.44"
mimalloc = { version = "*", features = ["v3"] }
#jemallocator = "0.5.4"
multiversion = "0.8.0"

[dependencies.bevy]
version = "0.18.1"
default-features = false
features = [
  # --- Bevy Internal Crates & Core Features ---
  "bevy_asset",          # Provides asset functionality
  "bevy_camera",         # Provides camera and visibility types, as well as culling primitives.
  "bevy_color",          # Provides shared color types and operations
  "bevy_core_pipeline",  # Provides cameras and other basic render pipeline features
  #"bevy_gizmos",         # Adds support for gizmos
  "bevy_image",          # Load and access image data. Usually added by an image format
  "bevy_input_focus",    # Enable input focus subsystem
  "bevy_log",            # Enable integration with tracing and log
  "bevy_pbr",            # Adds PBR rendering
  "bevy_picking",        # Provides picking functionality
  "bevy_render",         # Provides rendering functionality
  "bevy_scene",          # Provides scene functionality
  "bevy_state",          # Enable built in global state machines
  "bevy_text",           # Provides text functionality
  "bevy_ui",             # A custom ECS-driven UI framework
  "bevy_window",         # Windowing layer
  "bevy_winit",          # winit window and input backend

  # --- Picking Implementations ---
  "sprite_picking",      # Provides an implementation for picking sprites
  "ui_picking",          # Provides an implementation for picking UI
  #"mesh_picking",       # Provides an implementation for picking meshes

  # --- Optional Bevy Internal Crates ---
  #"bevy_animation",     # Provides animation functionality
  "bevy_anti_alias",    # Provides various anti aliasing solutions
  #"bevy_audio",         # Provides audio functionality
  #"bevy_camera_controller", # Provides a collection of prebuilt camera controllers
  #"bevy_ci_testing",    # Enable systems that allow for automated testing on CI
  "bevy_dev_tools",     # Provides a collection of developer tools
  #"bevy_gilrs",         # Adds gamepad support
  #"bevy_gizmos_render", # Adds support for rendering gizmos
  #"bevy_gltf",          # glTF support
  "bevy_light",         # Provides light types such as point lights, directional lights, spotlights.
  "bevy_mesh",          # Provides a mesh format and some primitive meshing routines.
  #"bevy_mikktspace",    # Provides vertex tangent generation for use with bevy_mesh.
  "bevy_post_process",  # Provides post process effects such as depth of field, bloom, chromatic aberration. (needed by bevy_anti_alias?)
  #"bevy_remote",        # Enable the Bevy Remote Protocol
  "bevy_shader",        # Provides shaders usable through asset handles.
  #"bevy_solari",        # Provides raytraced lighting (experimental)
  "bevy_sprite_render", # Provides sprite rendering functionality
  #"bevy_ui_debug",      # Provides a debug overlay for bevy UI
  "bevy_ui_render",     # Provides rendering functionality for bevy_ui

  # --- Low-level Tunables ---
  "std",                 # Allows access to the std crate.
  "async-io",            # Use async-io’s implementation of block_on instead of futures-lite’s implementation.
  "async_executor",      # Uses async-executor as a task execution backend.
  #"multi_threaded",      # Enables multithreaded parallelism in the engine.
  "custom_cursor",       # Enable winit custom cursor support
  #"critical-section",   # critical-section provides the building blocks for synchronization primitives on all platforms.
  #"libm",               # Uses the libm maths library instead of the one provided in std and core.

  # --- Platform-Specific Support ---
  "x11",                 # Linux: X11 display server support
  "wayland",             # Linux: Wayland display server support
  #"accesskit_unix",     # Enable AccessKit on Unix backends
  #"android-game-activity",    # Android GameActivity support.
  #"android-native-activity",  # Android NativeActivity support.
  #"android_shared_stdcxx",    # Enable using a shared stdlib for cxx on Android
  #"web",                # Enables use of browser APIs. (Wasm32 only)
  #"webgl2",             # Enable some limitations to be able to use WebGL2.
  #"webgpu",             # Enable support for WebGPU in Wasm. (Overrides webgl2)

  # --- Built-in Data & LUTs ---
  #"default_font",        # Include a default font (ASCII only, ~20kB)
  #"smaa_luts",           # Include SMAA Look Up Tables KTX2 Files
  "tonemapping_luts",    # Include tonemapping Look Up Tables KTX2 files.
  #"bluenoise_texture",  # Include blue noise KTX2 file used by environment maps, Solari and atmosphere

  # --- Graphics & Rendering Features ---
  "spirv_shader_passthrough", # Enable passthrough loading for SPIR-V shaders (Vulkan only)
  #"dlss",               # NVIDIA Deep Learning Super Sampling
  #"experimental_pbr_pcss", # Enable support for PCSS (experimental)
  #"meshlet",            # Enables the meshlet renderer for dense high-poly scenes (experimental)
  #"pbr_anisotropy_texture", # Enable support for anisotropy texture in the StandardMaterial
  #"pbr_clustered_decals",   # Enable support for Clustered Decals
  #"pbr_light_textures",     # Enable support for Light Textures
  #"pbr_multi_layer_material_textures", # Enable support for multi-layer material textures
  #"pbr_specular_textures",  # Enable support for specular textures in the StandardMaterial
  #"pbr_transmission_textures", # Enable support for transmission-related textures
  #"statically-linked-dxc",  # Statically linked DXC shader compiler for DirectX 12

  # --- Asset File Format Support ---
  "png",                 # PNG image format support
  "bmp",                 # BMP image format support
  "dds",                 # DDS compressed texture support
  "ico",                 # ICO image format support
  "jpeg",                # JPEG image format support
  "ktx2",                # KTX2 compressed texture support
  "zstd_c",              # C Zstandard decompression for KTX2.
  #"zstd_rust",           # Pure rust Zstandard decompression for KTX2.
  #"basis-universal",    # Basis Universal compressed texture support
  #"exr",                # EXR image format support
  #"ff",                 # Farbfeld image format support
  #"gif",                # GIF image format support
  #"hdr",                # HDR image format support
  #"pnm",                # PNM image format support (pam, pbm, pgm, ppm)
  #"qoi",                # QOI image format support
  #"tga",                # TGA image format support
  #"tiff",               # TIFF image format support
  #"webp",               # WebP image format support
  #"zlib",               # For KTX2 supercompression

  # --- Audio Format Support ---
  #"flac",               # FLAC audio format support
  #"mp3",                # MP3 audio format support
  #"vorbis",             # OGG/VORBIS audio format support
  #"wav",                # WAV audio format support
  #"symphonia-aac",      # AAC audio format support (through symphonia)
  #"symphonia-all",      # AAC, FLAC, MP3, MP4, OGG/VORBIS, and WAV (through symphonia)
  #"symphonia-flac",     # FLAC audio format support (through symphonia)
  #"symphonia-isomp4",   # MP4 audio format support (through symphonia)
  #"symphonia-vorbis",   # OGG/VORBIS audio format support (through symphonia)
  #"symphonia-wav",      # WAV audio format support (through symphonia)

  # --- Input Support ---
  #"gamepad",            # Gamepad support. Automatically enabled by bevy_gilrs.
  #"gestures",           # Gestures support. Automatically enabled by bevy_window.
  "keyboard",           # Keyboard support. Automatically enabled by bevy_window.
  "mouse",              # Mouse support. Automatically enabled by bevy_window.
  #"touch",              # Touch support. Automatically enabled by bevy_window.

  # --- Reflection, Serialization, Logic ---
  "serialize",           # Enable serialization support through serde
  #"reflect_auto_register", # Enable automatic reflect registration
  #"reflect_auto_register_static", # Enable automatic reflect registration without inventory.
  #"reflect_documentation", # Enables bevy_reflect to access documentation comments at runtime
  #"reflect_functions",   # Enable function reflection
  #"morph",              # Enables support for morph target weights in bevy_mesh
  #"morph_animation",    # Enables bevy_mesh and bevy_animation morph weight support

  # --- Shaders ---
  #"shader_format_glsl", # Enable support for shaders in GLSL
  #"shader_format_spirv",# Enable support for shaders in SPIR-V
  #"shader_format_wesl", # Enable support for shaders in WESL

  # --- Asset Management & Task Execution ---
  #"asset_processor",     # Enables the built-in asset processor for processed assets.
  "file_watcher",        # Enables watching the filesystem for Bevy Asset hot-reloading
  #"compressed_image_saver", # Enables compressed KTX2 UASTC texture output on the asset processor
  #"embedded_watcher",   # Enables watching in memory asset providers for hot-reloading
  #"http",               # Enables downloading assets from HTTP sources.
  #"https",              # Enables downloading assets from HTTPS sources.
  #"meshlet_processor",  # Enables processing meshes into meshlet meshes for bevy_pbr
  #"web_asset_cache",    # Enable caching downloaded assets on the filesystem.

  # --- Development, Debug & Tracing ---
  #"glam_assert",         # Enable assertions to check the validity of parameters passed to glam
  #"bevy_ci_testing",    # Enable systems that allow for automated testing on CI
  #"bevy_debug_stepping",# Enable stepping-based debugging of Bevy systems
  #"debug",              # Enable collecting debug information about systems and components
  #"debug_glam_assert",  # Enable assertions in debug builds for glam
  #"detailed_trace",     # Enable detailed trace event logging.
  #"hotpatching",        # Enable hotpatching of Bevy systems
  #"raw_vulkan_init",    # Forces wgpu instance to be initialized using raw Vulkan HAL
  #"sysinfo_plugin",     # Enables system information diagnostic plugin
  #"trace",              # Tracing support
  #"trace_chrome",       # Tracing support, saving a file in Chrome Tracing format
  #"trace_tracy",        # Tracing support, exposing a port for Tracy
  #"trace_tracy_memory", # Tracing support, with memory profiling, for Tracy
  #"track_location",     # Enables source location tracking for change detection

  # --- Experimental & Specialized ---
  #"experimental_bevy_feathers", # Feathers widget collection.
  #"experimental_bevy_ui_widgets", # Experimental headless widget collection for Bevy UI.
  #"free_camera",        # Enables the free cam from bevy_camera_controller
  #"pan_camera",         # Enables the pan camera from bevy_camera_controller
  #"ghost_nodes",        # Experimental support for nodes that are ignored for UI layouting
]

[features]
# Keep dynamic linking enabled by default for local/dev builds (faster compile)
# but allow CI to disable it by building with `--no-default-features`.
bevy_development_opts = ["bevy/dynamic_linking", "bevy/glam_assert", "bevy/track_location"]#, "bevy/debug", "bevy/dev_tools"]
default = ["bevy_development_opts"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
