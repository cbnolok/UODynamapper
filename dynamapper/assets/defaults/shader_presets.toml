# ------------------
# --- ENHANCED PRESETS ---
# ------------------
# Formerly a more modern look with smooth lighting, fill lights, and basic grading.
# Now the Enhanced client's look on EC content, through Enhanced's own art and terrain paths.
# Every term the Enhanced client lacks is off: tone curve (identity), grading, gloom, fog, ambient, fill, rim,
# specular, bent normals, sharpening, the warm light colour, highlights, depth tint, grunge and the light decals.
# exposure and global_lighting stay as brightness. The land keeps the smooth per-pixel lighting
# (terrain_shading_model 0) with the client's half-Lambert diffuse: wrap 0.5 gives (N.L + 1) / 2, white,
# strength 1. The client draws no shadow for statics, items or foliage (only mobiles get one), so the sprite
# shadow shape and the contact and projected shadows are off. The sun stays the former fixed light.

