# Shader Presets.
# This file defines the lighting and tuning parameters for different rendering styles and times of day.

default_preset = "classic.morning"

# ------------------
# --- LEGEND ---
# ------------------
#
# === [Effects (general)] ===
# --- Modes & Toggles ---
# shading_mode:      The core rendering style. 0: Classic, 1: Enhanced, 2: KR.
#                    KR-like and UOD-Painterly both use 2 and the KR content; the preset group tells them apart.
# normal_mode:       How surface normals are calculated. 0: Geometric (faceted), 1: Bicubic (smooth).
# enable_bent:       If 1, uses pre-calculated bent normals to simulate ambient occlusion. 0: off.
# terrain_shading_model: How shading_mode 1 and 2 shade land. 0: smooth per-pixel lighting.
#                    1: the KR and Enhanced clients' per-vertex half-Lambert grey, interpolated over their two
#                    triangles per cell, times the material colour; no other lighting terms.
# enable_fog:        If 1, enables procedural, height-based fog. 0: off.
# enable_gloom:      If 1, enables a screen-space darkening effect (KR-style only). 0: off.
# enable_tonemap:    If 1, applies tonemapping to the final color. 0: off.
# tone_curve:        The tonemap's curve. 0: the visual profile's curve, exposure inside it.
#                    1: identity, exposure as plain brightness, clamped like the clients' 8-bit target.
# enable_grading:    If 1, applies color grading. 0: off.
# enable_blur:       If 1, applies a subtle blur to the base terrain texture. 0: off.
# texture_filter:    How land and sprite textures are filtered. 0: pixel art, nearest, and with
#                    enable_linear_filtering a bilinear that only softens the texel seams.
#                    1: the KR client's plain bilinear from one level. Zoomed out past the client's 18.4-tile
#                    view, a box of bilinear taps stands in for the mip levels its textures do not have.
# enable_client_grunge: If 1, the KR client's grunge on the statics it grunges: their colour times its grunge
#                    texture (tex_land_kr.uddp, else the Enhanced Client's image of the id in tex_aux_ec.uddp),
#                    mapped from each static's map position, so CC and EC art get the same. On in KR-like.
# client_grunge_strength: 0 to 1. 1 is the client's full multiply; 0 leaves the colour as it is.
#
# --- Intensities & Strengths ---
# ambient_strength:  Base intensity of ambient light (0.0 to 1.0).
# diffuse_strength:  Intensity of the main directional light (sun/moon).
# specular_strength: Intensity of specular highlights on surfaces.
# rim_strength:      Intensity of the rim light effect, which highlights edges.
# fill_strength:     Intensity of the hemispheric fill light.
# sharpness_factor:  Strength of the texture sharpening effect.
# sharpness_mix:     How much the sharpened texture is blended with the original (0.0 to 1.0).
# blur_strength:     How much the blurred texture is blended with the original (0.0 to 1.0).
# blur_radius:       The radius of the texture blur in screen pixels, 0.5 to 8. The shader never blurs less
#                    than half a pixel, so 0.5 is the smallest radius that draws differently from a larger one.
#
# === [Lighting] ===
# --- Colors ---
# light_color:         The color of the main directional light as [R, G, B].
# atmosphere_tint:       The base color of the ambient light as [R, G, B].
# fill_sky_color:      Color of the upper hemisphere fill light as [R, G, B, Intensity].
# fill_ground_color:   Color of the lower hemisphere fill light as [R, G, B, Intensity].
# rim_color:           Color and exponent of the rim light as [R, G, B, Power].
# grade_warm_color:    The warm tone for color grading as [R, G, B].
# grade_cool_color:    The cool tone for color grading as [R, G, B].
# fog_color:           The color of the procedural fog as [R, G, B, Max_Mix_Factor].
#
# --- Parameters ---
# exposure:          Overall scene exposure value. In the KR profile curve it is the only pre-scale: the former
#                    separate KR gain (kr_tonemap_params.x, 0.9) is folded into the UOD-Painterly exposures.
# grade_params:      Vector of grading parameters: [Strength, Headroom_Reserve, Hemi_Chroma_Tint, Headroom_On(1/0)].
# grade_extra:       Vector of additional grading parameters: [Vibrance, Saturation, Contrast, Split_Strength].
# grade_chroma_knee: The chroma knee, after Saturation, in linear light: a colour's relative chroma
#                    c = (max - min) / max of its RGB channels above this knee becomes
#                    knee + (c - knee) * grade_chroma_slope, by moving the colour toward its Rec. 709 luma as
#                    Saturation does, so luma and hue stay. Only vivid colours change. 0 to 1; 1 is off.
# grade_chroma_slope: The slope above the knee, 0 to 1. 1 changes nothing; 0 caps relative chroma at the knee.
# gloom_params:      Vector of gloom parameters: [Amount, Height_Falloff, Shadow_Bias].
# fog_params:        Vector of fog parameters: [Distance_Density, Height_Density, Noise_Scale, Noise_Strength].
# gloom_color:       Dedicated gloom tint [R, G, B, Desaturation]. RGB: color shadows tint toward.
#                    A: shadow desaturation (0.0 = none, 1.0 = grayscale). [0,0,0,0] = use ambient color.
# fog_night_color:   Night fog tint [R, G, B, Blend_Factor]. Blends fog_color toward this darker tint.
#                    At blend=0: fog_color as-is. At blend=1: fully replaced (e.g. deep blue night).
# diffuse_wrap:      Half-Lambert wrap factor. 0.0 = standard Lambert, 0.3-0.5 = soft shadow terminator.
#
# === [Sun] ===
# One static light direction for land, art and the sprite shadows.
# azimuth_degrees:   Compass bearing of the sun, clockwise from north (decreasing UO y): 90 east, 180 south.
# elevation_degrees: Height of the sun above the horizon: 0 on the horizon, 90 overhead.
#                    Classic and UOD-Painterly keep the former fixed light (-1, 2.5, -1), which is
#                    azimuth 315 and elevation atan2(2.5, sqrt(2)) = 60.50379. KR-like and Enhanced take the
#                    clients' terrain light, azimuth 180 and elevation 45.
#
# === [Scene dimming] ===
# Each group dims one way, required there and refused elsewhere:
# global_lighting:   Classic and UOD-Painterly. A scene brightness multiplier (1.0 = unchanged).
# [client_lighting]: KR-like and Enhanced. Both clients' night composite, per channel on the 8-bit values:
#                    out = clamp(4 * (0.25 * level + B * (1 - level)) * scene), level = 1 - light_level / 31,
#                    B = the night map (TerrainTexture.uop entry 21, in tex_aux_ec.uddp) with the lights lerped
#                    over it. Light level 0 is the identity: lights and the night tint vanish by day.
#   light_level:      The server light level, 0 (full day) to 30. ServUO gives about 0 by day, 9 to 10 at night
#                     and 26 in dungeons.
#   overlay_strength: The night map's tint, 0 to 2. 1 is the client; 0 replaces the map by its luminance (the
#                     same darkening without the blue); above 1 pushes the tint further from that luminance.
#   overlay_color:    The night map's mean colour as [R, G, B] 8-bit values. The default
#                     [0.012604, 0.017285, 0.153818] is the map's exact mean, so the map is the client's; another
#                     colour scales the map's channels by colour / mean, keeping its cloud pattern.
#
# === [Local lights] ===
# [<group>.local_lights]: KR-like and Enhanced, one table per style (not per time of day), required there and refused
#                    elsewhere. The land light decals and static local lights (Light/Static Interaction, 0 in these
#                    presets; the static local lights also need enable_static_art_local_lights), and where the light
#                    sprites drawn into the light buffer sit (centre_on_items; source and intensities leave them be).
#   source:           The lights they take: "light_sprites", the client light sprites (a light on the ground under
#                     each sprite's glow, sized like the sprite, coloured by its texture's alpha-weighted mean), or
#                     "light_mul", light.mul as in Classic (the statics with the LightSource flag, the light.mul size,
#                     the hue or light colour; fewer lights and smaller pools than the light sprites, so dimmer
#                     overall at one intensity).
#   light_sprites_intensity, light_mul_intensity: 0 to 4, the multiplier of their contribution while they take that
#                     source, on top of Light/Static Interaction; each source keeps its own. 1 leaves the lights as
#                     they come, 0 turns them off.
#   centre_on_items:  true centres the light sprites the clients place far from their item (the tileart's default
#                     offsets, (-5, -4) at scale 2 and the like: lava, fires, hearths, some sconces and windows) on
#                     the item's cell, keeping their height on screen, and the lights taken from them with them; the
#                     sprites whose offsets place them near their item (lanterns, wall torches, window beams) stay.
#                     false is the clients' placement. light.mul lights sit on their item's cell either way.
#
# === [Land texture variation] ===
# land_texture_variation: KR-like, Enhanced and UOD-Painterly, one key per style (not per time of day), required there
#                    and refused in Classic. true breaks up the repetition of the KR and Enhanced terrain materials
#                    runtime_specs/land/LandTextureVariation.kdl lists (grass, dirt, sand, forest, snow, swamp, jungle,
#                    rock, cool lava): their colour layers drawn through overlapping hexagons two cells wide, each
#                    moved by a random offset and, for textures with no direction, turned by a random quarter turn,
#                    their blend mask through a larger grid of its own. It fades out as the view zooms out, where the
#                    repetition no longer shows. false is the plain tiling, as the clients draw it. Off in every preset.
#
# === [Light cover] ===
# [<group>] light_cover: every style, one value per style (not per time of day), required. How the lights a roof,
#                    an upper floor or a wall covers are drawn: the light.mul decals of Classic and UOD-Painterly, the
#                    light sprites of KR-like and Enhanced, and the local lights taken from either. "uod" in every
#                    preset. "classicuo" and "clients" hide a whole light by the cell in front of it, (x + 1, y + 1),
#                    toward the camera.
#   "uod":            Dynamapper's rule: no light is hidden for being covered; each glow is clipped pixel by pixel.
#                     It does not light the floors, roofs and other opaque statics (not Transparent or NoDraw) at
#                     least 5 z above the light, nor the side facing the camera of the walls and solid statics past
#                     the light toward the camera; it lights the ground and floors at or below it on both sides of a
#                     wall, and the walls facing it. A light whose item the z view does not draw goes with it.
#   "classicuo":      ClassicUO's rule: an opaque static (not Transparent or NoDraw) at least 5 z above the light hides
#                     it.
#   "clients":        The Enhanced and KR clients' rule: any static in a higher 20-z band above the land, band =
#                     (z - land z + 140) / 20, hides it; no exception for eaves or see-through items. KR-like follows
#                     the KR client: the bands clamped to 0 to 15, each counted from the averaged land z of its own
#                     cell. The other styles follow the Enhanced client: all counted from the land z of the light's
#                     cell. In both, a floor or roof at least 5 z above the light hides it too (the clients draw such
#                     lights over the floor).
#
# === [Player floor rule] ===
# [kr] player_floor_rule: KR-like only, one value for the style, required there and refused elsewhere (the other
#                    styles follow ClassicUO's rule). Which rule "Show Only the Player's Floor"
#                    (world_rendering.show_only_player_floor) hides what is above the player by:
#   "classicuo":      ClassicUO's: a ceiling over the player caps the statics at its z and hides the roofs; land over
#                     the player caps the land and the statics a little above the player.
#   "kr":             The KR client's: with a static more than 14 z above the player on the player's cell, or a roof
#                     on the cell in front, every static, item and multi part in a higher 20-z layer than the player's
#                     is hidden, layer = clamp((z - land z + 140) / 20, 0, 15), each counted from the averaged land z
#                     of its own cell; land is never cut by height, and goes whole while the player stands below the
#                     land of the player's cell (in a cave). The lights of the hidden layers go with them, and the
#                     statics of the hidden layers no longer cover or clip the lights below them.
#
# === [Client shadows] ===
# client_shadows:    KR-like only, required there and refused elsewhere. true draws the KR client's static shadows
#                    (its Show Shadows option): a black copy of each static, item and foliage sprite, leaning right
#                    11.25 degrees from the ground below it, darkening what lies behind it by 0.25, at every time
#                    of day and without stacking. It stands in for the shadow shape, contact and projected sprite
#                    shadows, which KR-like keeps at 0.
#
# ------------------
# --- CLASSIC PRESETS ---
# ------------------
# Simplified rendering emulating the original UO client.
# Key features like grading, gloom, specular, and rim lighting are disabled.

[classic]
light_cover = "uod"

[classic.morning]
global_lighting = 1.02
