# ------------------
# --- UOD-PAINTERLY PRESETS ---
# ------------------
# Dynamapper's own painterly KR look: the KR content with every effect enabled. These were the KR-like
# presets until KR-like became the faithful client look; the values are unchanged but specular_strength and the
# morning and afternoon vibrance. Since land shading follows the camera's view direction, the sun behind the scene
# mirrors into the camera from all flat land, so the former 0.02..0.04 laid a grey sheen over it: each time of day
# now has the largest value that keeps the sheen faint (under 1% of the pixels changed by more than 4 levels, with EC
# and CC land).
# The vibrance (grade_extra's first value) of the morning and afternoon, once 0.38 and 0.45, turned the desert sand
# orange: 0.21 and 0.25 bring its chroma down by about a quarter while grass and rock change little.

