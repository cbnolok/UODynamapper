# ------------------
# --- KR PRESETS ---
# ------------------
# KR-like: the Kingdom Reborn client's look on KR content.
# Every term the KR client lacks is off: tone curve (identity), gloom, fog (available, off),
# fill, rim, specular, bent normals, the warm light colour, land and art temperature, fake normals, highlights,
# depth tint, relief shadows, mottle, grunge, transition grime, colour wash and the light decals. exposure
# stays as brightness. The night and caves dim as in the client, through the night composite (client_lighting)
# in place of global_lighting: light level 0 by day (the client's identity; the former global_lighting 1.04 and
# 1.08 are gone), 10 at night and 26 in caves, the levels ServUO sends, with the night map at the client's
# strength and colour. The light decals draw into the composite's light buffer, so they light only at night.
# Land shades per vertex like the client (terrain_shading_model 1).
# Switched to per-pixel, the land diffuse is still the client's half-Lambert: wrap 0.5 gives
# (N.L + 1) / 2, white, strength 1. Statics, items and foliage cast the client's own shadow (client_shadows),
# which does not follow the sun; the sprite shadow shape, contact and projected shadows are off.
# The sun is the client's terrain light, from the south at 45 degrees (azimuth 180, elevation 45).
# Land and sprite textures take the client's plain bilinear (texture_filter 1): no pixel-art remap, no blur.
# Two settings were tuned against the KR reference screenshots (docs/agent_notes/krlike_reference_tuning.md):
# - grading, which the client lacks, is on with the chroma knee alone (knee 0.55, slope 0; saturation 1, vibrance 0,
#   contrast 1, split tone 0): the screenshots' grass and foliage are about 0.33 saturated, the KR textures and art
#   0.5 to 0.65, while stone, wood and ground already match. The knee lowers only the vivid colours, where a lower
#   saturation (0.8 before) also greyed stone, wood and water. It acts before the night composite.
# - ambient_strength 0.146 lights only water under per-vertex land: with the sun at 45 degrees it lifts the water's
#   wrapped Lambert 0.854 to 1, the client's unlit water (its water layer never modulates by the vertex light).
#   Switched to per-pixel land, it also adds that ambient to the land.
# The full-featured painterly rendering with all effects enabled is UOD-Painterly, below.

