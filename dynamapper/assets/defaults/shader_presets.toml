# ------------------
# --- KR PRESETS ---
# ------------------
# KR-like: the Kingdom Reborn client's look on KR content.
# Every term the KR client lacks is off: tone curve (identity), grading, gloom, fog (available, off), ambient,
# fill, rim, specular, bent normals, the warm light colour, land and art temperature, fake normals, highlights,
# depth tint, relief shadows, mottle, grunge, transition grime, colour wash and the light decals. exposure
# and global_lighting stay as brightness. Land shades per vertex like the client (terrain_shading_model 1).
# Switched to per-pixel, the land diffuse is still the client's half-Lambert: wrap 0.5 gives
# (N.L + 1) / 2, white, strength 1. The sprite shadow settings (shadow shape, contact and projected shadows)
# keep their earlier values until the client's static shadow is reproduced.
# The sun is the client's terrain light, from the south at 45 degrees (azimuth 180, elevation 45); the
# projected sprite shadows follow it.
# Land and sprite textures take the client's plain bilinear (texture_filter 1): no pixel-art remap, no blur.
# The full-featured painterly rendering with all effects enabled is UOD-Painterly, below.

