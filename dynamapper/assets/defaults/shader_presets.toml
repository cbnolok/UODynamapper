# ------------------
# --- ENHANCED PRESETS ---
# ------------------
# Formerly a more modern look with smooth lighting, fill lights, and basic grading.
# Now the Enhanced client's look on EC content, through Enhanced's own art and terrain paths.
# Every term the Enhanced client lacks is off: tone curve (identity), grading, gloom, fog, ambient, fill, rim,
# specular, bent normals, sharpening, the warm light colour, highlights, depth tint, grunge and the light decals.
# exposure stays as brightness. The night and caves dim as in the client, through the night composite
# (client_lighting) in place of global_lighting: light level 0 by day (the client's identity; the former
# global_lighting 1.08 and 1.14 are gone), 10 at night and 26 in caves, the levels ServUO sends, with the night
# map at the client's strength and colour. Land shades per vertex like the client (terrain_shading_model 1,
# the same code as the KR client's), which reads none of the per-pixel land terms. The Land Shading option can
# still switch Enhanced to per pixel (terrain_shading_model 0, shading_mode 1): that path reads the headroom
# limit, and the fill colours, the rim power and the sharpness factor once their strengths are raised, so those
# keep their values. It never reads diffuse_wrap (its diffuse is a plain Lambert, white, strength 1), the rim colour or the
# headroom reserve (grade_params.y; it caps at a fixed 0.9): these are neutral, 0 and white. The client draws no
# shadow for statics, items or foliage (only mobiles get one), so the sprite shadow shape and the contact and
# projected shadows are off. The sun is the client's terrain light, from the south at 45 degrees (azimuth 180,
# elevation 45), as in KR-like.

