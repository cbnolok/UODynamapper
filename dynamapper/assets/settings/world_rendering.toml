enable_statics = true
enable_static_lights = true
enable_static_art_local_lights = false

[land_streaming]
prepare_max_blocks_per_frame = 32768
upload_max_ops_per_frame = 8
upload_max_bytes_per_frame = 16777216

[diagnostics]
enable_render_diagnostics = false
dump_to_console = false
dump_interval_sec = 2.0
log_render_breakdown = false
log_world_state = false
log_system_timers = false
highlight_hovered_static_object = false

[shader_simplification]
force_minimal_shader = false
force_flat_fragment_shader = false
