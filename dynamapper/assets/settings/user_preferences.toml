[input]
movement_speed_multiplier = 1.0
smooth_movement = true

[window]
ui_scale = 1.15
player_position_scale = 1.0
sysmessages_scale = 1.0
performance_overlay_scale = 1.0
cursor_position_scale = 1.0
free_camera = false
perspective_camera = false
# Behind the gump and paperdoll images: "viewer_default" (the window) or { color = [red, green, blue] }.
gump_background = "viewer_default"
# What the Enhanced and KR-like presets draw for a paperdoll: "frames" (the client's 3D paperdoll, from
# paperdoll_ec.uddp) or "gumps" (the old-style gump paperdoll). The Classic preset always draws gumps.
enhanced_paperdoll = "frames"

[debug]
map_render_wireframe = false

[performance]
show_overlay = true
show_perf_stats_overlay = true
show_player_position_overlay = true
show_cursor_inspect_overlay = true
frame_limit_enabled = true
target_fps = 60
