[package]
name = "udd-image-codecs"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = { version = "0.6.5", optional = true }
dds = "0.2"
libktx-rs = { version = "0.2", optional = true }
rayon = { version = "1.12.0", optional = true }
vk2dfd = { version = "0.1", optional = true }
wgpu-types = "27"
wide = { version = "1.4", optional = true }

[features]
default = []
bc7-encode = ["dep:rayon", "dep:wide"]
ktx2 = ["dep:color-eyre", "dep:libktx-rs", "dep:vk2dfd"]

[[bench]]
name = "bc7_encode"
harness = false
required-features = ["bc7-encode"]
