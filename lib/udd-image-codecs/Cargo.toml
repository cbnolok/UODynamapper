[package]
name = "udd-image-codecs"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
arc_with_non_send_sync = "allow"
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"


[dependencies]
color-eyre = { version = "0.6.5", optional = true }
dds = "0.2"
libktx-rs = { version = "0.3", optional = true }
rayon = { version = "1.12.0", optional = true }
vk2dfd = { version = "0.1", optional = true }
wgpu-types = "29"
wide = { version = "1.5", optional = true }

[features]
default = []
bc7-encode = ["dep:rayon", "dep:wide"]
ktx2 = ["dep:color-eyre", "dep:libktx-rs", "dep:vk2dfd"]

[[bench]]
name = "bc7_encode"
harness = false
required-features = ["bc7-encode"]
