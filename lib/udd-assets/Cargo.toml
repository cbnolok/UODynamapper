[package]
name = "udd-assets"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
udd-container = { path = "../udd-container" }
udd-image-codecs = { path = "../udd-image-codecs" }
uocf = { path = "../uocf" }
bytemuck = { version = "1.*", default-features = false, features = ["derive", "aarch64_simd", "avx512_simd"] }
color-eyre = "0.6"
byteorder = "1.5"
knuffel.workspace = true
serde_json = "1"
dds = "0.2"

[features]
default = []
bc7-encode = ["udd-image-codecs/bc7-encode"]
