[package]
name = "udd-assets"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
udd-container = { path = "../udd-container" }
uot-texture-codecs = { path = "../support/uot-texture-codecs" }
uocf = { path = "../uocf" }
uot-kdl = { path = "../support/uot-kdl" }
particle-sim = { path = "../ec-effects/particle-sim", default-features = false }
bytemuck.workspace = true
color-eyre.workspace = true
byteorder.workspace = true
# Only for the Decode derives: their code names the knuffel crate. Parse through uot-kdl.
knuffel.workspace = true
serde_json.workspace = true
serde.workspace = true
dds.workspace = true
# The gump image hash of the Classic gumps a gumps_ec package shares with gumps_cc.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh64"] }
workspace-hack.workspace = true

[dev-dependencies]
# The tests write BC7 single gumps, which only the encode feature can.
uot-texture-codecs = { path = "../support/uot-texture-codecs", features = ["bc7-encode"] }

[features]
default = []
bc7-encode = ["uot-texture-codecs/bc7-encode"]

#[lib]
#crate-type = ["dylib", "rlib"]
