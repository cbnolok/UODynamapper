[package]
name = "uot-gpu-compute"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
bytemuck.workspace = true
color-eyre.workspace = true
# Waits on wgpu's adapter and device requests where no async runtime runs (the stride measurement, the tests).
pollster = "0.4"
serde.workspace = true
serde_json.workspace = true
# The BC7 RDO's price model, error scales and partition tables (bc7_rdo.rs), the CPU RDO's.
uot-texture-codecs = { path = "../uot-texture-codecs", features = ["bc7-encode"] }
wgpu.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The reference block_encode.rs's kernels (our copies of its BC7 and BC1 ones) are checked against, block for block
# (block_encode/tests.rs); its wgpu is ours (30).
block_compression = { workspace = true, features = ["bc15"] }
# The block encoding evaluation (block_encode/tests.rs): PNG sheets (the CPU decoding of the blocks and the CPU BC7
# encoder for reference come from uot-texture-codecs).
image = { workspace = true, features = ["png"] }
# Reads the frames it evaluates on from the animation packages; a dev-dependency only, the crate itself depends on
# no udd crate.
udd-assets = { path = "../../udd-assets" }
