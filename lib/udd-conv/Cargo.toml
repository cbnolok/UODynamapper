[package]
name = "udd-conv"
version = "0.1.0"
edition = "2021"

[lints.clippy]
needless_lifetimes = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"

[dependencies]
bytemuck = { version = "1.25.0", default-features = false, features = ["derive"] }
byteorder = { version = "1.5.0", default-features = false }
color-eyre = "0.6.5"
dds = { version = "0.2", default-features = false } # Portable BC7 decode path.
guillotiere = "0.6"
indicatif = "0.18.4"
log = "0.4.29"
rayon = "1.12.0"
uocf = { path = "../uocf" }
udd-assets = { path = "../udd-assets", features = ["bc7-encode"] }
udd-container = { path = "../udd-container" }
wgpu-types = "27"
ddsfile = "0.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image-postprocess = { path = "../image-postprocess" }

[features]
default = []
