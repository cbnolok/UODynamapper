[package]
name = "udd-conv"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
field_reassign_with_default = "allow"
items_after_test_module = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
bytemuck.workspace = true
byteorder.workspace = true
color-eyre.workspace = true
dds = { version = "0.2", default-features = false } # Portable BC7 decode path.
guillotiere = "0.7"
log.workspace = true
rayon.workspace = true
tracing.workspace = true
tracing-indicatif.workspace = true
uocf = { path = "../uocf" }
udd-assets = { path = "../udd-assets" }
udd-container = { path = "../udd-container" }
udd-image-codecs = { path = "../udd-image-codecs", features = ["bc7-encode"] }
wgpu-types.workspace = true
ddsfile.workspace = true
serde.workspace = true
serde_json.workspace = true
image-postprocess = { path = "../image-postprocess" }

[features]
default = []

[[bench]]
name = "mobile_anim_blit"
harness = false

#[lib]
#crate-type = ["dylib", "rlib"]
