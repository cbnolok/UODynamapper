# Cargo.toml
[package]
name = "uocf"
version = "0.0.1"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
field_reassign_with_default = "allow"
if_same_then_else = "allow"
items_after_test_module = "allow"
len_without_is_empty = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
nonminimal_bool = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"

[dependencies]
byteorder.workspace = true
color-eyre = { workspace = true, features = ["track-caller"] }
dds = { version = "0.2", default-features = false }
derive-new = { version = "0.7", default-features = false }
getset = { version = "0.1", default-features = false }
image = { workspace = true, features = ["bmp", "jpeg", "png", "tga", "webp"] }
# Paletted PNG (8-bit with a tRNS chunk) of Classic animation frames, which the `image` encoder does not write.
png = "0.18"
ddsfile.workspace = true
wide = { version = "1", default-features = false, features = ["std"] }
bytemuck.workspace = true
bitflags = "2"
nohash-hasher = "0.2.0"
indexmap = "2.14.2"
# Standard Rust log facade — allows uocf to emit log events without
# coupling to any specific logger implementation (the app provides the backend).
log = { version = "0.4", default-features = false }
adler32 = "1.2.0"
flate2 = { workspace = true, features = ["zlib-ng"] }
libz-sys.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
toml.workspace = true
memmap2 = "0.9"
# File identity (device and inode, or the Windows file index): an output that is a source, or a link to one, is refused.
same-file = "1.0.6"
symphonia.workspace = true
uot-kdl = { path = "../support/uot-kdl" }
# Only for the Decode derives: their code names the knuffel crate. Parse through uot-kdl.
knuffel.workspace = true
# Diagnostic trait of knuffel's parse errors, read for their line and column.
miette = { version = "5", default-features = false }
# Syntax checks of replaced entries (`enhanced/packages/syntax_check.rs`): the client's Lua (5.1 with `continue` and the
# bitwise operators, read as Lua 5.3 with the 5.2+ syntax refused: `lua53`) and XML well-formedness.
full_moon = { version = "3.0.0", default-features = false, features = ["lua53"] }
roxmltree = "0.21.2"
workspace-hack.workspace = true

[dev-dependencies]
rand = "*"

[features]
profiling = []
tile_mappings_builder = []

[[bench]]
name = "rle_decode"
harness = false

#[lib]
#crate-type = ["dylib", "rlib"]
