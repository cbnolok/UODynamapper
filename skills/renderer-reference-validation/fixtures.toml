# Fixed views of the screenshot regression harness (scripts/visual_harness.py; see SKILL.md, "Regression harness").
#
# Read strictly: an unknown key, a missing required key or a value of the wrong type is an error naming this file,
# the fixture and the allowed names. Every fixture names the defect it guards against in `guards`, with the commit
# that fixed it when there is one. Add a fixture for every visual bug you fix, named after what it guards.
#
# Fixture keys:
#   name        required; unique, lower-case words joined by "-", saying what the view guards
#   guards      required; the defect this view caught or would catch
#   tier        required; "quick" (the core set, a few minutes) or "full" (only with --tier full)
#   map, x, y, z  required; the player position the view is taken from
#   tags        optional; words for --only selection (a fixture also matches its own name)
#   times       optional; preset periods: "morning", "afternoon", "night", "cave" (default: defaults.times)
#   styles      optional; "classic", "enhanced", "kr", "painterly" (default: defaults.styles)
#   sources     optional; "art/land" pairs run in every style of the fixture, art "cc" or "ec", land "cc", "ec"
#               or "kr" (default: defaults.sources, or defaults.quick_sources in the quick tier, per style)
#   zoom        optional; camera zoom (default: defaults.zoom)
#   camera      optional; "orthographic" or "perspective" (default: defaults.camera)
#   tolerance   optional; { pixel_threshold = <0..255>, changed_pct = <percent> }: a pixel counts as changed when
#               its largest channel difference is above pixel_threshold, and the capture fails the comparison
#               when more than changed_pct percent of its pixels changed (default: defaults.tolerance)
#   settings    optional; overrides written into the run's own settings copy, checked against the tree's files:
#                 world_rendering = { key = value }   world_rendering.toml ("section.key" for its tables)
#                 graphics = { key = value }          graphics.toml [graphics]
#                 style = { key = value }             land.toml [<style>] (light_cover, player_floor_rule, ...);
#                                                     skipped in a style that lacks the key
#                 preset = { "table.key" = value }    land.toml [<style>.<time>.<table>] of the slot that renders
#   reference   optional; { path = "...", note = "...", crop = [x, y, width, height] } an original-client
#               screenshot shown beside the captures in the sheets (crop optional)

[defaults]
times = ["afternoon"]
styles = ["classic", "enhanced", "kr", "painterly"]
zoom = 1.0
camera = "orthographic"
# Two quick-tier runs of one binary (2026-11-15) matched exactly in 39 of 40 captures; the 40th, lava at night in
# Classic, differed by at most 3 levels in 1.1% of its pixels. A threshold of 4 leaves room for that jitter without
# hiding a real change.
tolerance = { pixel_threshold = 4, changed_pct = 0.01 }

[defaults.sources]
classic = ["cc/cc", "ec/ec"]
enhanced = ["ec/ec"]
kr = ["ec/kr", "ec/ec"]
painterly = ["ec/ec"]

[defaults.quick_sources]
classic = ["cc/cc"]
enhanced = ["ec/ec"]
kr = ["ec/kr"]
painterly = ["ec/ec"]

