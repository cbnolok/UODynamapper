name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - prereleases
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Tag to use for the auto-generated prerelease (e.g. 'nightly')"
        required: false
        default: "nightly"

env:
  CARGO_TERM_COLOR: always
  # Use mold for faster linking (installed below)
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  # RUSTFLAGS: "-C link-arg=-fuse-ld=/usr/bin/mold" # Handled by build scripts

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to create/write GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # These are cached by GitHub's runner between runs if unchanged.
        # apt-get itself is fast (~15s). mold makes linking ~5x faster than ld.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            clang \
            mold

      # dtolnay/rust-toolchain already sets up basic rust
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      # Caches ~/.cargo/registry (downloaded crates) and the incremental build
      # artifacts in target/. On a cache hit, subsequent builds are very fast.
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-x86_64-nightly-sccache"

      - name: Build release binary
        env:
          SCCACHE_GHA_ENABLED: "true"
          # RUSTC_WRAPPER must be set to the wrapper script.
          # The wrapper script will then call sccache + rustc.
          RUSTC_WRAPPER: "./scripts/build/common/rustc_wrapper.sh"
          CARGO_INCREMENTAL: 0
        run: |
          chmod +x scripts/build/linux/build-release-nightly.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/linux/build-release-nightly.sh

      - name: Package binary and assets
        run: |
          mkdir -p release_package
          cp target/release/dynamapper release_package/
          cp -r assets release_package/
          cp README.md release_package/ 2>/dev/null || true
          # Zip the package
          sudo apt-get install -y zip
          zip -r dynamapper-linux-x86_64.zip release_package
          echo "Archive size: $(du -sh dynamapper-linux-x86_64.zip | cut -f1)"

      # Always upload as workflow artifact (available from the Actions UI, 30d TTL)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-linux-x86_64
          path: dynamapper-linux-x86_64.zip
          retention-days: 30

      # On tag push: create a proper versioned GitHub Release
      - name: Create versioned GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dynamapper-linux-x86_64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # On manual dispatch: create/overwrite the "nightly" (or custom) prerelease
      - name: Compute nightly tag name
        if: github.event_name == 'workflow_dispatch'
        id: nightly_tag
        run: echo "tag=${{ github.event.inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly_tag.outputs.tag }}
          name: "Nightly (${{ steps.nightly_tag.outputs.tag }}) – ${{ github.sha }}"
          prerelease: true
          files: dynamapper-linux-x86_64.zip
          generate_release_notes: false
          body: |
            🌙 **Auto-generated prerelease** from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            Built on: ${{ github.event.repository.updated_at }}

            > ⚠️ UO game data files are **not** included. You must supply your own and configure the path in `settings.toml`.

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-x86_64-nightly-sccache"

      - name: Build release binary
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: 0
        run: pwsh ./scripts/build/windows/build.ps1

      - name: Package binary and assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_package | Out-Null
          Copy-Item -Path "target/release/dynamapper.exe" -Destination "release_package/"
          Copy-Item -Path "assets" -Destination "release_package/" -Recurse
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination "release_package/" }
          Compress-Archive -Path "release_package" -DestinationPath "dynamapper-windows-x86_64.zip"
          Write-Host "Archive size: $(Get-Item dynamapper-windows-x86_64.zip | ForEach-Object {'{0:N2} MB' -f ($_.Length / 1MB)})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-windows-x86_64
          path: dynamapper-windows-x86_64.zip
          retention-days: 30

      - name: Upload to release (tagged commits)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dynamapper-windows-x86_64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # On manual dispatch: create/overwrite the "nightly" (or custom) prerelease
      - name: Compute nightly tag name
        if: github.event_name == 'workflow_dispatch'
        id: nightly_tag
        run: echo "tag=${{ github.event.inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly_tag.outputs.tag }}
          name: "Nightly (${{ steps.nightly_tag.outputs.tag }}) – ${{ github.sha }}"
          prerelease: true
          files: dynamapper-windows-x86_64.zip
          generate_release_notes: false
          body: |
            🌙 **Auto-generated prerelease** from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            Built on: ${{ github.event.repository.updated_at }}

            > ⚠️ UO game data files are **not** included. You must supply your own and configure the path in `settings.toml`.

  build-macos:
    name: Build (macOS x86_64 + ARM64)
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "macos-nightly-sccache"

      - name: Build release binary (x86_64)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: 0
        run: |
          chmod +x scripts/build/macos/build.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          # Modify script temporarily to support target or use environment
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang ./scripts/build/macos/build.sh --target x86_64-apple-darwin

      - name: Build release binary (ARM64)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: 0
        run: |
          # The script currently doesn't support arguments, I should probably update it or use RUSTFLAGS
          ./scripts/build/macos/build.sh --target aarch64-apple-darwin

      - name: Package binary and assets (x86_64)
        run: |
          mkdir -p release_package_x86_64
          cp target/x86_64-apple-darwin/release/dynamapper release_package_x86_64/
          cp -r assets release_package_x86_64/
          cp README.md release_package_x86_64/ 2>/dev/null || true
          zip -r dynamapper-macos-x86_64.zip release_package_x86_64
          echo "Archive size: $(du -sh dynamapper-macos-x86_64.zip | cut -f1)"

      - name: Package binary and assets (ARM64)
        run: |
          mkdir -p release_package_arm64
          cp target/aarch64-apple-darwin/release/dynamapper release_package_arm64/
          cp -r assets release_package_arm64/
          cp README.md release_package_arm64/ 2>/dev/null || true
          zip -r dynamapper-macos-arm64.zip release_package_arm64
          echo "Archive size: $(du -sh dynamapper-macos-arm64.zip | cut -f1)"

      - name: Upload artifacts (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-macos-x86_64
          path: dynamapper-macos-x86_64.zip
          retention-days: 30

      - name: Upload artifacts (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-macos-arm64
          path: dynamapper-macos-arm64.zip
          retention-days: 30

      - name: Upload to release (tagged commits on main/prereleases only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dynamapper-macos-x86_64.zip
            dynamapper-macos-arm64.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
