name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - prereleases
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Tag to use for the auto-generated prerelease (e.g. 'nightly')"
        required: false
        default: "nightly"
      publish:
        description: "Publish the prerelease; false builds every target without publishing (a build check)"
        type: boolean
        required: false
        default: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets a developer's local target-dir; CI builds into ./target, where the package recipes look.
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_NO_DAEMON: "1"
  # Dated nightly for every nightly build (the justfile reads it too). Bump it on purpose: nightly-2026-10-31 fails to
  # compile wesl 0.6.0 ("cycle detected when computing when `error::ResolveError` needs async drop").
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-10-29

jobs:
  build-linux:
    name: Build (Linux x86_64)
    # The gnu binaries need at least the build image's glibc (22.04: 2.35; 24.04 would raise it to 2.39).
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_DIR: /tmp/sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            pkg-config clang mold
          sudo ln -sf $(which mold) /usr/bin/ld.mold

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-x86_64-nightly-sccache"

      # Cargo can't pin a dependency to "the version bevy_egui uses": this fails when a bevy or bevy_egui bump
      # leaves egui, glam or another shared crate on two versions.
      - name: Check dependency versions against bevy and bevy_egui
        timeout-minutes: 10
        run: just check-dep-alignment

      - name: Check that the shell scripts are portable POSIX sh
        run: just check-shell

      - name: Build release binary
        env:
          CC: "clang"
          CXX: "clang++"
        run: just build-ci-workspace

      - name: Package binary and assets
        run: just package-release dynamapper-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-x86_64
          path: artifact/dynamapper-linux-x86_64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-x86_64-tools
          path: artifact/dynamapper-linux-x86_64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-linux-arm64:
    name: Build (Linux aarch64)
    # Same image generation as the x86_64 job, so both gnu builds need the same glibc (2.35).
    runs-on: ubuntu-22.04-arm
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_DIR: /tmp/sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            pkg-config clang mold

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-arm64-nightly-sccache"

      - name: Build release binary
        env:
          CC: "clang"
          CXX: "clang++"
        run: just build-ci-workspace --target aarch64-unknown-linux-gnu

      - name: Package binary and assets
        run: just package-release dynamapper-linux-arm64 aarch64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-arm64
          path: artifact/dynamapper-linux-arm64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-arm64-tools
          path: artifact/dynamapper-linux-arm64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-linux-musl-x86_64:
    name: Build (Linux x86_64 musl - static, CLI tools)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release binary
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_TARGET_DIR=target \
            -e RUST_NIGHTLY_TOOLCHAIN \
            alpine:3.24 \
            sh -eu -c '
              apk add --no-cache \
                bash build-base cmake gcc g++ clang mold \
                curl ca-certificates pkgconf just
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_NIGHTLY_TOOLCHAIN"
              . "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-musl
              rustup component add rust-src
              chmod +x scripts/build/common/rustc_wrapper.sh
              export CC=gcc
              export CXX=g++
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=clang
              just build-linux-musl-release-nightly x86_64-unknown-linux-musl
              chown -R "$HOST_UID:$HOST_GID" /work/target
            '

      # The build runs in the Alpine container; packaging runs on the runner, which has no just of its own.
      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Package CLI tools
        run: just package-release-cli dynamapper-linux-x86_64-musl x86_64-unknown-linux-musl

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-x86_64-musl-tools
          path: artifact/dynamapper-linux-x86_64-musl-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-linux-musl-arm64:
    name: Build (Linux aarch64 musl - static, CLI tools)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release binary
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_TARGET_DIR=target \
            -e RUST_NIGHTLY_TOOLCHAIN \
            alpine:3.24 \
            sh -eu -c '
              apk add --no-cache \
                bash build-base cmake gcc g++ clang mold \
                curl ca-certificates pkgconf just
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_NIGHTLY_TOOLCHAIN"
              . "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-musl
              rustup component add rust-src
              chmod +x scripts/build/common/rustc_wrapper.sh
              export CC=gcc
              export CXX=g++
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=clang
              just build-linux-musl-release-nightly aarch64-unknown-linux-musl
              chown -R "$HOST_UID:$HOST_GID" /work/target
            '

      # The build runs in the Alpine container; packaging runs on the runner, which has no just of its own.
      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Package CLI tools
        run: just package-release-cli dynamapper-linux-arm64-musl aarch64-unknown-linux-musl

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-linux-arm64-musl-tools
          path: artifact/dynamapper-linux-arm64-musl-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          components: rust-src

      # Pinned: sccache 0.17+ expands cargo's @argfile and spawns rustc with every argument, which passes Windows'
      # 32767-character command line limit (os error 206). 0.16 forwards an oversized argfile to rustc and leaves
      # just that call uncached. Remove once https://github.com/mozilla/sccache/issues/2397 is fixed in a release.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-x86_64-nightly-sccache"

      - name: Build release binary
        run: just build-ci-workspace

      - name: Package binary and assets
        run: just package-release dynamapper-windows-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-x86_64
          path: artifact/dynamapper-windows-x86_64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-x86_64-tools
          path: artifact/dynamapper-windows-x86_64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-windows-clang:
    name: Build (Windows x86_64 clang MinGW)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup MSYS2 MinGW clang toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-pkgconf

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
          components: rust-src

      # No sccache here, so the justfile runs cargo without a wrapper. This job cross-compiles: the nightly's per-crate
      # build directories give rustc one `-L` per host and per target dependency, under the longer
      # target\x86_64-pc-windows-gnu\ path, so many commands come close to Windows' 32767-character limit. sccache
      # rewrites a command it caches (`--emit=x` split in two, quoted feature cfgs), so one cargo left just under the
      # limit came out over it (os error 206, bevy_winit on 2026-11-06). Without the wrapper, cargo's own @argfile
      # fallback covers every length. rust-cache below still keeps the compiled dependencies.
      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-x86_64-clang-nightly"

      - name: Build release binary
        env:
          CC: "clang"
          CXX: "clang++"
          AR: "llvm-ar"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: "clang"
        run: |
          $mingwBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          just build-ci-workspace --target x86_64-pc-windows-gnu

      - name: Package binary and assets
        run: just package-release dynamapper-windows-x86_64-clang x86_64-pc-windows-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-x86_64-clang
          path: artifact/dynamapper-windows-x86_64-clang/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-x86_64-clang-tools
          path: artifact/dynamapper-windows-x86_64-clang-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-windows-arm64:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          targets: aarch64-pc-windows-msvc
          components: rust-src

      # Pinned: sccache 0.17+ expands cargo's @argfile and spawns rustc with every argument, which passes Windows'
      # 32767-character command line limit (os error 206). 0.16 forwards an oversized argfile to rustc and leaves
      # just that call uncached. Remove once https://github.com/mozilla/sccache/issues/2397 is fixed in a release.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Just
        run: cargo install just --locked

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-arm64-nightly-sccache"

      - name: Build release binary
        run: just build-ci-workspace --target aarch64-pc-windows-msvc

      - name: Package binary and assets
        run: just package-release dynamapper-windows-arm64 aarch64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-arm64
          path: artifact/dynamapper-windows-arm64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-windows-arm64-tools
          path: artifact/dynamapper-windows-arm64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  # Apple Silicon is the macOS target CI focuses on. x86_64 stays supported: it builds only when a release is published
  # (the same condition as the publish job, which would otherwise be skipped with it) and on a manual build check (a
  # manual run with publish off), and a failure doesn't block that release. macos-15-intel is reported to be the last Intel runner, retiring around fall 2027 (not confirmed by GitHub);
  # after that, cross-compile this target on the ARM runner.
  build-macos-x86_64:
    name: Build (macOS x86_64)
    runs-on: macos-15-intel
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref_name == 'main'
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          targets: x86_64-apple-darwin
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "macos-x86_64-nightly-sccache"

      - name: Build release binary
        run: just build-ci-workspace --target x86_64-apple-darwin

      - name: Package binary and assets
        run: just package-release dynamapper-macos-x86_64 x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-macos-x86_64
          path: artifact/dynamapper-macos-x86_64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-macos-x86_64-tools
          path: artifact/dynamapper-macos-x86_64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  build-macos-arm64:
    name: Build (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          targets: aarch64-apple-darwin
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "macos-arm64-nightly-sccache"

      - name: Build release binary
        run: just build-ci-workspace --target aarch64-apple-darwin

      - name: Package binary and assets
        run: just package-release dynamapper-macos-arm64 aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-macos-arm64
          path: artifact/dynamapper-macos-arm64/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

      - name: Upload tools artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamapper-macos-arm64-tools
          path: artifact/dynamapper-macos-arm64-tools/*
          retention-days: ${{ github.ref_name == 'prereleases' && 7 || 90 }}

  publish:
    name: Publish Release
    needs: [build-linux, build-linux-arm64, build-linux-musl-x86_64, build-linux-musl-arm64, build-windows, build-windows-clang, build-windows-arm64, build-macos-x86_64, build-macos-arm64]
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || github.ref_type == 'tag' || github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release archives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip
          mkdir -p release-assets
          shopt -s nullglob

          # Every archive holds one folder: UODynamapper/ (the app) or UODynamapper-tools/ (bin/, shared/, docs/).
          for artifact_dir in artifacts/*; do
            [[ -d "$artifact_dir" ]] || continue
            artifact_name="$(basename "$artifact_dir")"
            # Artifacts come back with every file mode 644: make the Linux and macOS binaries executable again.
            for binary in "$artifact_dir"/UODynamapper/dynamapper "$artifact_dir"/UODynamapper-tools/bin/*; do
              if [[ -f "$binary" ]]; then chmod +x "$binary"; fi
            done
            (
              cd "$artifact_dir"
              zip -r "../../release-assets/${artifact_name}.zip" ./*
            )
          done

      - name: Compute tag name
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Nightly (${{ github.event.inputs.prerelease_tag }}) – ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=main-latest" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "name=Main Snapshot" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.name }}
          prerelease: ${{ steps.tag_info.outputs.is_prerelease == 'true' }}
          files: release-assets/*.zip
          overwrite_files: true
          generate_release_notes: ${{ steps.tag_info.outputs.is_prerelease == 'false' }}
          body: |
            ${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'main') && format('Auto-generated build from commit `{0}` on branch `{1}`.  \n\nBuilt on: {2}  \n\n> UO game data files are not included. You must supply your own.', github.sha, github.ref_name, github.event.repository.updated_at) || '' }}
