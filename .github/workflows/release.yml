name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - prereleases
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Tag to use for the auto-generated prerelease (e.g. 'nightly')"
        required: false
        default: "nightly"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "false"
  SCCACHE_NO_DAEMON: "1"

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ runner.temp }}/sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            pkg-config clang mold
          sudo ln -sf $(which mold) /usr/bin/ld.mold

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-x86_64-nightly-sccache"

      - name: Build release binary
        env:
          CC: "clang"
          CXX: "clang++"
        run: |
          chmod +x scripts/build/linux/build-release-nightly-toolchain.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/linux/build-release-nightly-toolchain.sh

      - name: Package binary and assets
        run: |
          mkdir -p release_package
          cp target/release/dynamapper release_package/
          cp -r assets release_package/
          cp README.md release_package/ 2>/dev/null || true
          sudo apt-get install -y zip
          zip -r dynamapper-linux-x86_64.zip release_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-linux-x86_64
          path: dynamapper-linux-x86_64.zip
          retention-days: 7

  build-linux-arm64:
    name: Build (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ runner.temp }}/sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            pkg-config clang mold

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-arm64-nightly-sccache"

      - name: Build release binary
        env:
          CC: "clang"
          CXX: "clang++"
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          chmod +x scripts/build/linux/build-release-nightly-toolchain.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/linux/build-release-nightly-toolchain.sh --target aarch64-unknown-linux-gnu

      - name: Package binary and assets
        run: |
          mkdir -p release_package
          cp target/aarch64-unknown-linux-gnu/release/dynamapper release_package/
          cp -r assets release_package/
          cp README.md release_package/ 2>/dev/null || true
          sudo apt-get install -y zip
          zip -r dynamapper-linux-arm64.zip release_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-linux-arm64
          path: dynamapper-linux-arm64.zip
          retention-days: 7

  build-linux-musl-x86_64:
    name: Build (Linux x86_64 musl - static)
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /tmp/sccache
    container:
      image: messense/rust-musl-cross:x86_64-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          run_privileged() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          if command -v apt-get >/dev/null 2>&1; then
            run_privileged apt-get update -qq
            run_privileged apt-get install -y --no-install-recommends \
              build-essential clang git curl bash pkg-config \
              libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev zip
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache build-base clang git curl bash pkgconfig \
              alsa-lib-dev eudev-dev wayland-dev libxkbcommon-dev zip
          else
            echo "Unknown package manager; please ensure required native libs are available in the container"
            exit 1
          fi

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl
          components: rust-src

      - name: Prepare intel_tex_2 static libs for musl
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fetch --locked
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ ! -d "$cargo_home/registry/src" ] && [ -d "/root/.cargo/registry/src" ]; then
            cargo_home="/root/.cargo"
          fi
          crate_dir="$(find "$cargo_home/registry/src" -maxdepth 2 -type d -name 'intel_tex_2-*' | head -n 1)"
          if [ -z "$crate_dir" ]; then
            echo "intel_tex_2 source not found in cargo registry under $cargo_home"
            exit 1
          fi
          ispc_dir="$crate_dir/src/ispc"
          for stem in kernel kernel_astc ispc_texcomp_astc; do
            src="$ispc_dir/lib${stem}x86_64-unknown-linux-gnu.a"
            dst="$ispc_dir/lib${stem}x86_64-unknown-linux-musl.a"
            if [ -f "$src" ] && [ ! -f "$dst" ]; then
              cp "$src" "$dst"
            fi
          done

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-musl-x86_64-nightly-sccache"

      - name: Build release binary
        env:
          CC: "x86_64-linux-musl-gcc"
          CXX: "x86_64-linux-musl-g++"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: "x86_64-linux-musl-gcc"
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          chmod +x scripts/build/linux/build-release-nightly-toolchain.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/linux/build-release-nightly-toolchain.sh --target x86_64-unknown-linux-musl

      - name: Package binary and assets
        run: |
          mkdir -p release_package
          cp target/x86_64-unknown-linux-musl/release/dynamapper release_package/
          cp -r assets release_package/
          cp README.md release_package/ 2>/dev/null || true
          zip -r dynamapper-linux-x86_64-musl.zip release_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-linux-x86_64-musl
          path: dynamapper-linux-x86_64-musl.zip
          retention-days: 7

  build-linux-musl-arm64:
    name: Build (Linux aarch64 musl - static)
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /tmp/sccache
    container:
      image: messense/rust-musl-cross:aarch64-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          run_privileged() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          if command -v apt-get >/dev/null 2>&1; then
            if command -v dpkg >/dev/null 2>&1 && [ "$(dpkg --print-architecture)" = "arm64" ]; then
              sed -i 's|http://security.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list || true
              sed -i 's|http://archive.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list || true
            fi
            run_privileged apt-get update -qq
            run_privileged apt-get install -y --no-install-recommends \
              build-essential clang git curl bash pkg-config \
              libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev zip
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache build-base clang git curl bash pkgconfig \
              alsa-lib-dev eudev-dev wayland-dev libxkbcommon-dev zip
          else
            echo "Unknown package manager; please ensure required native libs are available in the container"
            exit 1
          fi

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-musl
          components: rust-src

      - name: Prepare intel_tex_2 static libs for musl
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fetch --locked
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ ! -d "$cargo_home/registry/src" ] && [ -d "/root/.cargo/registry/src" ]; then
            cargo_home="/root/.cargo"
          fi
          crate_dir="$(find "$cargo_home/registry/src" -maxdepth 2 -type d -name 'intel_tex_2-*' | head -n 1)"
          if [ -z "$crate_dir" ]; then
            echo "intel_tex_2 source not found in cargo registry under $cargo_home"
            exit 1
          fi
          ispc_dir="$crate_dir/src/ispc"
          for stem in kernel kernel_astc ispc_texcomp_astc; do
            src="$ispc_dir/lib${stem}aarch64-unknown-linux-gnu.a"
            dst="$ispc_dir/lib${stem}aarch64-unknown-linux-musl.a"
            if [ -f "$src" ] && [ ! -f "$dst" ]; then
              cp "$src" "$dst"
            fi
          done

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "linux-musl-arm64-nightly-sccache"

      - name: Build release binary
        env:
          CC: "aarch64-linux-musl-gcc"
          CXX: "aarch64-linux-musl-g++"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: "aarch64-linux-musl-gcc"
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          chmod +x scripts/build/linux/build-release-nightly-toolchain.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/linux/build-release-nightly-toolchain.sh --target aarch64-unknown-linux-musl

      - name: Package binary and assets
        run: |
          mkdir -p release_package
          cp target/aarch64-unknown-linux-musl/release/dynamapper release_package/
          cp -r assets release_package/
          cp README.md release_package/ 2>/dev/null || true
          zip -r dynamapper-linux-arm64-musl.zip release_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-linux-arm64-musl
          path: dynamapper-linux-arm64-musl.zip
          retention-days: 7

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-x86_64-nightly-sccache"

      - name: Build release binary
        run: pwsh ./scripts/build/windows/build-release-nightly-toolchain.ps1

      - name: Package binary and assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_package | Out-Null
          Copy-Item -Path "target/release/dynamapper.exe" -Destination "release_package/"
          Copy-Item -Path "assets" -Destination "release_package/" -Recurse
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination "release_package/" }
          Compress-Archive -Path "release_package" -DestinationPath "dynamapper-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-windows-x86_64
          path: dynamapper-windows-x86_64.zip
          retention-days: 7

  build-windows-arm64:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-pc-windows-msvc
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "windows-arm64-nightly-sccache"

      - name: Build release binary
        shell: pwsh
        run: |
          $Env:RUSTFLAGS = "-C force-unwind-tables=no -C symbol-mangling-version=v0 -Z share-generics=y -Z location-detail=none $Env:RUSTFLAGS"
          $Env:RUSTC_WRAPPER = (Resolve-Path "scripts/build/common/rustc_wrapper.bat").Path
          cargo +nightly build --release --locked --no-default-features `
            --bin dynamapper --package dynamapper `
            --target aarch64-pc-windows-msvc `
            -Z build-std=std,panic_abort `
            -Z build-std-features=optimize_for_size

      - name: Package binary and assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_package | Out-Null
          Copy-Item -Path "target/aarch64-pc-windows-msvc/release/dynamapper.exe" -Destination "release_package/"
          Copy-Item -Path "assets" -Destination "release_package/" -Recurse
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination "release_package/" }
          Compress-Archive -Path "release_package" -DestinationPath "dynamapper-windows-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-windows-arm64
          path: dynamapper-windows-arm64.zip
          retention-days: 7

  build-macos:
    name: Build (macOS x86_64 + ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: "macos-nightly-sccache"

      - name: Build release binary (x86_64)
        run: |
          chmod +x scripts/build/macos/build-release-nightly-toolchain.sh
          chmod +x scripts/build/common/rustc_wrapper.sh
          ./scripts/build/macos/build-release-nightly-toolchain.sh --target x86_64-apple-darwin

      - name: Build release binary (ARM64)
        run: |
          ./scripts/build/macos/build-release-nightly-toolchain.sh --target aarch64-apple-darwin

      - name: Package binary and assets
        run: |
          mkdir -p release_package_x86_64 release_package_arm64
          cp target/x86_64-apple-darwin/release/dynamapper release_package_x86_64/
          cp -r assets release_package_x86_64/
          zip -r dynamapper-macos-x86_64.zip release_package_x86_64
          cp target/aarch64-apple-darwin/release/dynamapper release_package_arm64/
          cp -r assets release_package_arm64/
          zip -r dynamapper-macos-arm64.zip release_package_arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamapper-macos
          path: dynamapper-macos-*.zip
          retention-days: 7

  publish:
    name: Publish Release
    needs: [build-linux, build-linux-arm64, build-linux-musl-x86_64, build-linux-musl-arm64, build-windows, build-windows-arm64, build-macos]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute tag name
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.prerelease_tag }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.is_prerelease == 'true' && format('Nightly ({0}) – {1}', steps.tag_info.outputs.tag, github.sha) || steps.tag_info.outputs.tag }}
          prerelease: ${{ steps.tag_info.outputs.is_prerelease == 'true' }}
          files: artifacts/*.zip
          generate_release_notes: ${{ steps.tag_info.outputs.is_prerelease == 'false' }}
          body: |
            ${{ steps.tag_info.outputs.is_prerelease == 'true' && format('🌙 **Auto-generated prerelease** from commit `{0}` on branch `{1}`.  \n\nBuilt on: {2}  \n\n> ⚠️ UO game data files are **not** included. You must supply your own.', github.sha, github.ref_name, github.event.repository.updated_at) || '' }}
