[package]
name = "uocf_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
uocf = { path = "../../uocf" }
color-eyre = "0.6.5"
byteorder = { version = "1.5.0", default-features = false }
flate2 = { version = "1.1.9", default-features = false }
env_logger = "0.11.10"
log = "0.4.29"
walkdir = "2.5.0"
csv = "1.3.1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
dds = { version = "0.2", default-features = false }
ddsfile = "0.5.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"

[[bin]]
name = "uoptool"
path = "src/bin/uoptool.rs"

[[bin]]
name = "cc_uop_mul_converter"
path = "src/bin/cc_uop_mul_converter.rs"

[[bin]]
name = "texture_scanner"
path = "src/bin/texture_scanner.rs"

[[bin]]
name = "uop_dict_populator"
path = "src/bin/uop_dict_populator.rs"
