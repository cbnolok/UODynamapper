[package]
name = "udd-conv-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.18.4"
log = "0.4.29"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
udd-assets = { path = "../../lib/udd-assets" }
udd-container = { path = "../../lib/udd-container" }
udd-conv = { path = "../../lib/udd-conv" }
udd-image-codecs = { path = "../../lib/udd-image-codecs", features = ["ktx2"] }
udd-logging = { path = "../../lib/udd-logging" }
uocf = { path = "../../lib/uocf" }

[features]
default = []

[[bin]]
name = "udd-pack"
path = "src/bin/uddpack.rs"

[[bin]]
name = "udd-tool"
path = "src/bin/uddtool.rs"
