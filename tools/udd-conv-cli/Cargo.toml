[package]
name = "udd-conv-cli"
version = "0.1.0"
edition = "2024"
#resolver = "3"
autobins = false

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre.workspace = true
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif.workspace = true
log = "0.4.32"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
knuffel = "3"
toml.workspace = true
udd-assets = { path = "../../lib/udd-assets" }
udd-container = { path = "../../lib/udd-container" }
udd-conv = { path = "../../lib/udd-conv" }
udd-image-codecs = { path = "../../lib/udd-image-codecs", features = ["ktx2"] }
udd-logging = { path = "../../lib/udd-logging" }
uocf = { path = "../../lib/uocf" }

[features]
default = []

[[bin]]
name = "udd-pack"
path = "src/bin/uddpack.rs"

[[bin]]
name = "udd-tool"
path = "src/bin/uddtool.rs"
