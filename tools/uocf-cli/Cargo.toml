[package]
name = "uocf-cli"
version = "0.1.0"
edition = "2024"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"

[dependencies]
uocf = { path = "../../lib/uocf" }
# The NIF reader of the entry editor's NIF check.
gamebryo-nif = { path = "../../lib/ec-effects/gamebryo-nif" }
uot-logging = { path = "../../lib/support/uot-logging" }
log.workspace = true
clap = { workspace = true, features = ["derive", "unicode"] }
color-eyre.workspace = true
byteorder.workspace = true
dds.workspace = true
#ddsfile.workspace = true
flate2.workspace = true
image = { workspace = true, features = ["bmp", "png"] }
uot-texture-codecs = { path = "../../lib/support/uot-texture-codecs", features = ["ktx2"] }
workspace-hack.workspace = true

[[bin]]
name = "uocf-cli"
path = "src/main.rs"
