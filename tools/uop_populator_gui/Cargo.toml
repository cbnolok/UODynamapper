[package]
name = "uop_populator_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31.1", features = ["persistence", "glow"] }
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
uocf = { path = "../../uocf" }
rfd = { version = "0.15", features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
color-eyre = "0.6"
itertools = "0.14"
indicatif = "0.17"
crossbeam-channel = "0.5"
