[package]
name = "uddp-inspector-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", features = ["persistence"] }
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
uocf = { path = "../../lib/uocf" }
udd-assets = { path = "../../lib/udd-assets" }
udd-conv = { path = "../../lib/udd-conv" }
udd-container = { path = "../../lib/udd-container" }
ktx2 = "0.4"
zstd = "0.13"
color-eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rfd = { version = "0.15", features = ["xdg-portal"] }
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
bytemuck = "1.25"
image = { version = "0.25", default-features = false, features = [
    "png",
    "dds",
    "tga",
    "bmp",
] }
egui = "0.31.1"
