[package]
name = "uddp-inspector-gui"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_clamp = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
redundant_locals = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.rust]
dead_code = "allow"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
gui-shared = { path = "../../lib/gui-shared" }
uocf = { path = "../../lib/uocf" }
udd-assets = { path = "../../lib/udd-assets" }
udd-conv = { path = "../../lib/udd-conv" }
udd-container = { path = "../../lib/udd-container" }
# Simulates and rasterizes the effects of effects_ec.uddp; `dds` decodes the Hues.uop atlas.
particle-sim = { path = "../../lib/ec-effects/particle-sim", default-features = false, features = ["dds"] }
# BC1/BC3/BC7 decoding of effect textures.
dds.workspace = true
ktx2.workspace = true
zstd.workspace = true
color-eyre.workspace = true
byteorder.workspace = true
serde.workspace = true
bytemuck.workspace = true
log.workspace = true
image = { workspace = true, features = [
    "png",
    "dds",
    "tga",
    "bmp",
] }
workspace-hack = { version = "0.1", path = "../../lib/workspace-hack" }

[dev-dependencies]
# Compiles the Chaos scripts of the synthetic test package.
particle-sim = { path = "../../lib/ec-effects/particle-sim", features = ["uocf"] }
