[package]
name = "uocf-editor-gui"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
items_after_test_module = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_range_loop = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image = { workspace = true, features = ["png"] }
uot-image-postprocess = { path = "../../lib/support/uot-image-postprocess" }
uot-kdl = { path = "../../lib/support/uot-kdl" }
uocf = { path = "../../lib/uocf" }
particle-sim = { path = "../../lib/ec-effects/particle-sim" }
effect-gltf = { path = "../../lib/ec-effects/effect-gltf" }
gamebryo-nif = { path = "../../lib/ec-effects/gamebryo-nif" }
rfd.workspace = true
uot-logging = { path = "../../lib/support/uot-logging" }
uot-gui = { path = "../../lib/support/uot-gui" }
rodio.workspace = true
serde.workspace = true
color-eyre.workspace = true
# Only for the Decode derives: their code names the knuffel crate. Parse through uot-kdl.
knuffel.workspace = true
log.workspace = true
workspace-hack.workspace = true
