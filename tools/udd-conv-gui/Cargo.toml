[package]
name = "udd-conv-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", features = ["persistence"] }
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["image"] }
rfd = "0.14"
color-eyre = "0.6.5"
udd-conv = { path = "../../lib/udd-conv" }
udd-conv-ktx2 = { path = "../../lib/udd-conv-ktx2" }
udd-conv-cli = { path = "../udd-conv-cli" }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde"] }
ktx2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "dds"] }
zstd = "0.13"

[features]
default = []
ispc = ["udd-conv/ispc", "udd-conv-cli/ispc"]

[[bin]]
name = "udd-conv-gui"
path = "src/main.rs"
