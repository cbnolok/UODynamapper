[package]
name = "udd-conv-gui"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
field_reassign_with_default = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"

[dependencies]
eframe.workspace = true
egui.workspace = true
color-eyre.workspace = true
libc.workspace = true
log.workspace = true
udd-conv = { path = "../../lib/udd-conv" }
udd-image-codecs = { path = "../../lib/udd-image-codecs", features = ["ktx2"] }
udd-logging = { path = "../../lib/udd-logging" }
gui-shared = { path = "../../lib/gui-shared" }
uocf = { path = "../../lib/uocf" }
udd-conv-cli = { path = "../udd-conv-cli" }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
ktx2.workspace = true
image = { workspace = true, features = ["png", "dds"] }
zstd.workspace = true

[features]
default = []

[[bin]]
name = "udd-conv-gui"
path = "src/main.rs"
