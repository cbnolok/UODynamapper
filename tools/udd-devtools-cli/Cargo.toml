[package]
name = "udd-devtools-cli"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[lints]
workspace = true

[features]
dev-tool-tests = []
gpu-bench = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:wesl", "dep:dds"]
web-codecs = ["dep:libwebp-sys", "dep:image"]
# The lossless supercompression experiments on the BC7 mobile animation pages (udd-bc7-supercompress).
bc7-supercompress = ["dep:zstd", "dep:lz4", "dep:liblzma", "dep:guillotiere"]

[dependencies]
udd-assets = { path = "../../lib/udd-assets" }
udd-container = { path = "../../lib/udd-container" }
clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
rayon.workspace = true
ssimulacra2 = { version = "0.5.1", default-features = false }
workspace-hack.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { workspace = true, optional = true }
wesl = { version = "0.6", optional = true }
dds = { workspace = true, optional = true }
libwebp-sys = { version = "0.14.4", optional = true }
image = { workspace = true, features = ["png"], optional = true }
zstd = { workspace = true, optional = true }
# The container's LZ4 HC; its C library also has the dictionary functions the experiments declare.
lz4 = { version = "1.28", optional = true }
# LZMA2 through xz's liblzma, built from the crate's vendored source: the densest, slowest coder the experiments try.
liblzma = { version = "0.4.9", default-features = false, features = ["static"], optional = true }
# The mobile animation packer's allocator, to lay a body's frames out on pages of their own as the packer would.
guillotiere = { version = "0.7", optional = true }

[[bin]]
name = "udd-devtools-cli"
path = "src/main.rs"
required-features = ["dev-tool-tests"]

[[bin]]
name = "udd-gpu-cost"
path = "src/bin/gpu_cost.rs"
required-features = ["dev-tool-tests", "gpu-bench"]

[[bin]]
name = "udd-webmap-codecs"
path = "src/bin/webmap_codecs.rs"
required-features = ["dev-tool-tests", "web-codecs"]

[[bin]]
name = "udd-bc7-supercompress"
path = "src/bin/bc7_supercompress/main.rs"
required-features = ["dev-tool-tests", "bc7-supercompress"]
