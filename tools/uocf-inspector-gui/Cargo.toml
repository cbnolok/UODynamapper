[package]
name = "uocf-inspector-gui"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
items_after_test_module = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_range_loop = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"

[features]
default = ["audio-playback"]
# Sound playback in the Sounds view (rodio, which needs ALSA on Linux). The static musl builds leave it out:
# there is no static ALSA library to link.
audio-playback = ["dep:rodio"]

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image = { workspace = true, features = ["png"] }
image-postprocess = { path = "../../lib/image-postprocess" }
udd-conv = { path = "../../lib/udd-conv" }
udd-assets = { path = "../../lib/udd-assets" }
udd-kdl = { path = "../../lib/udd-kdl" }
udd-image-codecs = { path = "../../lib/udd-image-codecs", features = ["ktx2"] }
uocf = { path = "../../lib/uocf" }
particle-sim = { path = "../../lib/ec-effects/particle-sim" }
effect-gltf = { path = "../../lib/ec-effects/effect-gltf" }
gamebryo-nif = { path = "../../lib/ec-effects/gamebryo-nif" }
rfd.workspace = true
udd-logging = { path = "../../lib/udd-logging" }
gui-shared = { path = "../../lib/gui-shared" }
rodio = { workspace = true, optional = true }
serde.workspace = true
color-eyre.workspace = true
# Only for the Decode derives: their code names the knuffel crate. Parse through udd-kdl.
knuffel.workspace = true
log.workspace = true
workspace-hack = { version = "0.1", path = "../../lib/workspace-hack" }
