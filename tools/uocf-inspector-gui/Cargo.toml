[package]
name = "uocf-inspector-gui"
version = "0.1.0"
edition = "2024"
#resolver = "3"

[lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
    "persistence",
    "glow",
] }
egui = { version = "0.31.1", features = [ "bytemuck" ] }
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
image-postprocess = { path = "../../lib/image-postprocess" }
udd-conv = { path = "../../lib/udd-conv" }
udd-assets = { path = "../../lib/udd-assets" }
udd-image-codecs = { path = "../../lib/udd-image-codecs", features = ["ktx2"] }
uocf = { path = "../../lib/uocf" }
rfd = { version = "0.15", features = ["xdg-portal"] }
udd-logging = { path = "../../lib/udd-logging" }
rodio = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
color-eyre = "0.6"
knuffel = "3"
log = "0.4.29"
