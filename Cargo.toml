[workspace]
resolver = "2"
members = [
    "dynamapper",
    "uddconv",
    "uddconv_ktx2",
    "uddconv_cli",
    "uocf",
    "uocf_cli",
    "uddconv_gui",
    "uddp_inspector"
]


# --------- Release

[profile.release]
opt-level = 3
#opt-level = 2       # Optimize for speed with reasonable size increase (opt-level = 3 gives fastest possible code "z" smallest possible code)
codegen-units = 1   # Great impact on binary size (when combined with lto), and often improves performance as well
lto = "thin"        # Enable Link-Time Optimization (binary reduction size, often increases performance)
#lto = "fat"        # Slightly better than thin lto but at least twice slower (saves 1 mb more)

## Other settings
panic = "abort"     # Abort on panic instead of unwinding (saves executable size)
#overflow-checks = false
incremental = false
debug = false
strip = true        # Strip debug symbols

[profile.release.package.uocf]
opt-level = 3

# Target the "loggers" and infrastructure: no reasonable difference, < 1 mb.
#[profile.release.package.tracing]
#opt-level = "z"
#[profile.release.package.tracing-subscriber]
#opt-level = "z"
#[profile.release.package.tracing-core]
#opt-level = "z"
#[profile.release.package.bevy_log]
#opt-level = "z"
#[profile.release.package.bevy_ui]
#opt-level = "z"
#[profile.release.package.bevy_dev_tools]
#opt-level = "z"


# --------- Profiling

[profile.profiling]
inherits = "release"
debug = true
lto = false
strip = false
panic = "abort"
#overflow-checks = false

# --------- Debug

# NOTE: In a Cargo workspace, [profile.dev.package."*"] overrides the top-level [profile.dev] 
# for ALL packages (including workspace members). 
# To have different settings for your own code (like keeping debug info), 
# you must explicitly override them again in their own [profile.dev.package.NAME] sections.

[profile.dev]
opt-level = 1               # Default for the profile, but shadowed by "*" below
incremental = true          # Default for the profile, but shadowed by "*" below
debug = true                # Default for the profile, but shadowed by "*" below
debug-assertions = true     # Default for the profile, but shadowed by "*" below

# By default, build scripts and procedural macros (like serde_derive) are compiled
# with the same profile settings as the other code. This can make them slower.
# so we override the profile for build scripts and procedural macros.
[profile.dev.build-override]
opt-level = 3               # Makes the proc-macros run faster
debug = false
strip = true

# Settings for dependencies (incl. Bevy) AND workspace members (unless overridden below):
[profile.dev.package."*"]
opt-level = "s"             # Selective size optimization (better for behemoths like bevy_dylib)
incremental = false         # Disable incremental for dependencies to save disk space
debug = false               # Disable generation of debug info (save RAM/Disk)
debug-assertions = false    # Disable additional safety checks (including arithmetic overflow).
strip = true                # Strip debug symbols

# --- Workspace Member Overrides
# Since "*" above is very aggressive, we must opt-back-in to debug info for our own code.

# Specifically optimize uocf for map processing performance
[profile.dev.package.uocf]
opt-level = 3
codegen-units = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.dynamapper]
opt-level = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.uddconv]
opt-level = 3
codegen-units = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.uddconv_cli]
opt-level = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.uddconv_gui]
opt-level = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.uddp_inspector]
opt-level = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.uddconv_ktx2]
opt-level = 3
codegen-units = 1
debug = true
strip = false

[profile.dev.package.uocf_cli]
opt-level = 1
debug = true
debug-assertions = true
strip = false

