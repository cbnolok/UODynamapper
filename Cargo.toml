[workspace]
resolver = "2"
members = [
    "dynamapper",
    "uocf"
]

[profile.release]
## Max size reduction, but slower build time.
lto = true         # Enable Link-Time Optimization (drops dead code)
codegen-units = 1
## Small, acceptable size reduction, faster build time.
#lto = "thin"

## Other settings
panic = "abort"     # Abort on panic instead of unwinding
opt-level = "z"     # Optimize for size
#opt-level = 3
incremental = false
debug = false
strip = true        # Strip debug symbols

# Enable a small amount of optimization in debug mode for our crate.
[profile.dev]
opt-level = 1
# Incremental compilation. The project is fairly small, for now we don't need it.
incremental = true
# Additional safety checks (including arithmetic overflow).
debug-assertions = true

# Settings for dependencies (incl. Bevy), but not for our main code:
[profile.dev.package."*"]
opt-level = "z" # Selective size optimization (better for behemoths like bevy_dylib)
debug = false   # Disable generation of debug info (save RAM/Disk)
incremental = false

# Specifically optimize uocf (workspace member) for map processing performance
[profile.dev.package.uocf]
opt-level = 3
