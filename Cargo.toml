debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf]
opt-level = 3
codegen-units = 1
debug = true
debug-assertions = true
strip = false

[profile.dev.package.udd-conv-cli]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.udd-conv-gui]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-cli]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-asset-cli]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-inspector-gui]
opt-level = 2
debug = "line-tables-only"
