[workspace]
resolver = "3"
members = [
    "dynamapper",
    "lib/uocf",
    "lib/ec-effects/gamebryo-nif",
    "lib/ec-effects/particle-sim",
    "lib/ec-effects/effect-gltf",
    "lib/udd-conv",
    "lib/udd-image-codecs",
    "lib/udd-container",
    "lib/udd-assets",
    "lib/udd-kdl",
    "lib/udd-logging",
    "lib/gui-shared",
    "lib/image-postprocess",
    "lib/workspace-hack",
    "tools/udd-conv-cli",
    "tools/uocf-cli",
    "tools/uocf-devtools-cli",
    "tools/uoppackage-cli",
    "tools/udd-conv-gui",
    "tools/uddp-inspector-gui",
    "tools/uocf-editor-gui",
    "tools/uop-dict-populator-gui",
    "tools/uo-client-patcher-gui",
    "tools/webmap-export-cli",
]

[workspace.dependencies]
# Members depend on the empty stub published on crates.io (exact version, so a later release can't change what external
# users get). The [patch] below swaps in lib/workspace-hack, but only when building this workspace: projects that use
# our crates as path or git dependencies get the stub, and none of the hack's feature unification.
workspace-hack = "=0.1.0"
zstd = { version = "0.13", features = ["zstdmt"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11", "persistence", "glow"] }
egui = { version = "0.36", features = ["bytemuck"] }
egui_extras = { version = "0.36", features = ["image"] }
rfd = { version = "0.17", features = ["xdg-portal"] }
ktx2 = "0.5"
tracing = "0.1.44"
tracing-indicatif = "0.3"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ddsfile = "0.6.0"
color-eyre = "0.6"
toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde"] }
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "wgsl"] }
wgpu-profiler = "0.28.0"
wgpu-types = "30.0"
knuffel = "3"
bytemuck = { version = "1.*", default-features = false, features = ["derive", "aarch64_simd", "avx512_simd"] }
byteorder = "1.5"
clap = "4.6.6"
crossbeam-channel = "0.5"
csv = "1.4"
dds = "0.2"
flate2 = { version = "1.1.10", default-features = false }
# Classic zlib, built from source: the UOP entry encoder reproduces the client's level-6 streams with it. The
# `stock-zlib` feature keeps it classic zlib even if another crate asks libz-sys for zlib-ng; `libc` exposes
# `compress2`.
libz-sys = { version = "1.1.31", default-features = false, features = ["libc", "static", "stock-zlib"] }
image = { version = "0.25", default-features = false }
libc = "0.2"
log = "0.4.34"
rayon = "1.12.0"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# Pure-Rust MP3 decoding for the client audio (uocf::audio): the 0.5 line rodio 0.22 uses, so one copy is built.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"

[patch.crates-io]
workspace-hack = { path = "lib/workspace-hack" }

[workspace.lints.clippy]
collapsible_if = "allow"
empty_line_after_doc_comments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
nonminimal_bool = "allow"
too_many_arguments = "allow"


# --------- Release

[profile.release]
opt-level = 3
#opt-level = 2      # Optimize for speed with reasonable size increase (opt-level = 3 gives fastest possible code "z" smallest possible code)
codegen-units = 1   # Great impact on binary size (when combined with lto), and often improves performance as well
lto = "thin"        # Enable Link-Time Optimization (binary reduction size, often increases performance)
#lto = "fat"        # Slightly better than thin lto but at least twice slower (saves 1 mb more)

## Other settings
panic = "abort"     # Abort on panic instead of unwinding (saves executable size)
incremental = false
debug = false
debug-assertions = false
#overflow-checks = false
strip = true        # Strip debug info and symbols

#[profile.release.package.image-postprocess]
#opt-level = 3

# Target the "loggers" and infrastructure: no reasonable difference, < 1 mb.
#[profile.release.package.tracing]
#opt-level = "z"
#[profile.release.package.tracing-subscriber]
#opt-level = "z"
#[profile.release.package.tracing-core]
#opt-level = "z"
#[profile.release.package.bevy_log]
#opt-level = "z"
#[profile.release.package.bevy_ui]
#opt-level = "z"
#[profile.release.package.bevy_dev_tools]
#opt-level = "z"


# --------- Profiling

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
strip = false # "debuginfo"

#[profile.profiling.package.image-postprocess]
#opt-level = 3

# knuffel's KDL grammar, compiled only in udd-kdl: its generic type names run to about a megabyte each, so even
# line tables for it would dwarf the rest of the debug info.
[profile.profiling.package.udd-kdl]
debug = false

# for those we don't tipically need debug info for profiling
#[profile.profiling.package.uocf]
#debug = false
#strip = true
#[profile.profiling.package.udd-conv]
#[profile.profiling.package.udd-conv-cli]
#[profile.profiling.package.udd-conv-gui]
#[profile.profiling.package.uddp-inspector-gui]
#[profile.profiling.package.udd-image-codecs]
#[profile.profiling.package.uocf-cli]
#[profile.profiling.package.uocf-editor-gui]
#[profile.profiling.package.uop-dict-populator-gui]
#[profile.profiling.package.uo-client-patcher-gui]



# --------- Debug

# NOTE: In a Cargo workspace, [profile.dev.package."*"] overrides the top-level [profile.dev]
# for ALL packages (including workspace members).
# To have different settings for your own code (like keeping debug info),
# you must explicitly override them again in their own [profile.dev.package.NAME] sections.

[profile.dev]
opt-level = 1               # Default for the profile, but shadowed by "*" below
incremental = false         # Default for the profile, but shadowed by "*" below
debug = false               # Default for the profile, but shadowed by "*" below
debug-assertions = false    # Default for the profile, but shadowed by "*" below

# Settings for dependencies (incl. Bevy) AND workspace members (unless overridden below):
[profile.dev.package."*"]
opt-level = "s"             # Selective size optimization (better for behemoths like bevy_dylib)
incremental = false         # Disable incremental for dependencies to save disk space
debug = false               # Disable generation of debug info (save RAM/Disk)
debug-assertions = false    # Disable additional safety checks (including arithmetic overflow).
#strip = true               # Strip debug symbols

# By default, build scripts and procedural macros (like serde_derive) are compiled
# with the same profile settings as the other code. This can make them slower.
# so we override the profile for build scripts and procedural macros.
[profile.dev.build-override]
opt-level = 3               # Makes the proc-macros run faster
debug = false
#strip = true

# --- Workspace Dependencies Overrides
# For color-eyre performance (https://docs.rs/color-eyre/latest/color_eyre/)
[profile.dev.package.backtrace]
opt-level = 3

# --- Workspace Member Overrides
# Since "*" above is very aggressive, we must opt-back-in to debug info for our own code.

[profile.dev.package.dynamapper]
opt-level = 1
#incremental = true
debug = "line-tables-only" # true
debug-assertions = true
strip = false

# Specifically optimize data processing libraries for performance
[profile.dev.package.image-postprocess]
opt-level = 3
#codegen-units = 1 # makes compilation much slower, and we are in a debug build
debug = "line-tables-only"
debug-assertions = false
#strip = "debuginfo"

[profile.dev.package.udd-assets]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.udd-container]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.udd-conv]
opt-level = 2
#codegen-units = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.udd-image-codecs]
opt-level = 3
#codegen-units = 1
debug = "line-tables-only"
debug-assertions = false
#strip = "debuginfo"

# knuffel's KDL grammar, compiled only in udd-kdl: its generic type names run to about a megabyte each, so even
# line tables for it would dwarf the rest of the debug info. Optimized, since every KDL file goes through it.
[profile.dev.package.udd-kdl]
opt-level = 3
debug = false

[profile.dev.package.udd-logging]
opt-level = 1
#codegen-units = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf]
opt-level = 1
#codegen-units = 1
debug = "line-tables-only" # full debug info here was linked into every test binary (~1.6 GB each)
debug-assertions = true
strip = false

[profile.dev.package.udd-conv-cli]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.udd-conv-gui]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.gamebryo-nif]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.particle-sim]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-cli]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-devtools-cli]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uoppackage-cli]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
#strip = "debuginfo"

[profile.dev.package.uocf-editor-gui]
opt-level = 1
debug = "line-tables-only"
