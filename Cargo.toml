[workspace]
resolver = "3"
members = [
    "dynamapper",
    "uocf"
]

[profile.release]
#lto = true         # Enable Link-Time Optimization (drops dead code)
#codegen-units = 1  # Maximize size reduction (slower build time)
lto = "thin"
#opt-level = 3
opt-level = "s"     # Optimize for size
incremental = false
debug = false
strip = true        # Strip debug symbols

# Enable a small amount of optimization in debug mode for our crate.
[profile.dev]
opt-level = 1
# Incremental compilation. The project is fairly small, for now we don't need it.
incremental = true
# Additional safety checks (including arithmetic overflow).
debug-assertions = true

# Settings for dependencies (incl. Bevy), but not for our main code:
[profile.dev.package."*"]
opt-level = 3 # Enable high optimizations
debug = false # Disable generation of debug info
incremental = true

# Specifically optimize uocf (workspace member) for map processing performance
[profile.dev.package.uocf]
opt-level = 3
